name: Task 16 Readiness Patch

on:
  push:
    branches:
      - task-16-prebid-admin-control-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-16-prebid-admin-control-hardening
          fetch-depth: 0
      - name: Apply readiness transformation
        run: |
          set -euo pipefail
          python3 scripts/task16-readiness.py
          php -l app/Services/Monetization/SiteMonetizationReadinessService.php
          rm scripts/task16-readiness.py
          rm .github/workflows/task16-readiness-patch.yml
      - name: Commit materialized readiness changes
        run: |
          set -euo pipefail
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 16: harden Prebid readiness by resolved mode"
          git push origin HEAD:task-16-prebid-admin-control-hardening
