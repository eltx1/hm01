name: Materialize final production release

on:
  push:
    branches:
      - agent/production-ready-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean production branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/production-ready-final

      - name: Verify and materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "1d8b385eef21bafca68d1880d54e132bf70554ae62b439862f94090fb007db8f  .production-bootstrap/payload.tar.gz" | sha256sum --check --strict
          gzip --test .production-bootstrap/payload.tar.gz
          tar --extract --gzip --file .production-bootstrap/payload.tar.gz
          rm -rf .production-bootstrap
          rm -f .github/workflows/materialize-production-final.yml
          chmod +x scripts/build-release.sh scripts/validate-release.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, soap, openssl, fileinfo
          coverage: none

      - name: Validate PHP syntax and static analysis
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/static-analysis.php

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate migrations, routes, schedule, and full PHP tests
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite"
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan route:list
          php artisan schedule:list
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test and build browser assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run test:browser
          npm run build
          test -s public/build/manifest.json
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.min.js
          grep -q "1.3.0" public/assets/hm-loader.min.js

      - name: Build and validate exact production ZIP
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          ./scripts/build-release.sh
          ./scripts/validate-release.sh

      - name: Commit production implementation and release
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .production-bootstrap
          test ! -e .github/workflows/materialize-production-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Prepare production-ready Horus Media platform release"
          git push origin HEAD:agent/production-ready-final
