name: LordAI live anchor diagnostic

on:
  push:
    branches:
      - diag/lordai-live-anchors

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Probe production GPT runtime directly
        env:
          BROWSER_NAME: ${{ matrix.browser }}
          SITE_KEY: hm_ircll0vkqq54jvt9gz85mrh2
          EDGE_URL: https://702069fd.horus-media-cdn.pages.dev
        run: |
          set -euo pipefail
          curl -fsSL "$EDGE_URL/configs/$SITE_KEY/production.json" -o production.json
          RUNTIME_PATH="$(jq -r '.directDemand.placements.quick_sticky_top.candidates[0].tag.scriptUrl | sub("^https://cdn\\.horusmedia\\.net"; "")' production.json)"
          test -n "$RUNTIME_PATH"
          curl -fsSL "$EDGE_URL$RUNTIME_PATH" -o hm-gpt-runtime.js
          export RUNTIME_URL="$EDGE_URL$RUNTIME_PATH"
          export TOP_CONTAINER_ID="$(jq -r '.directDemand.placements.quick_sticky_top.candidates[0].tag.containerId' production.json)"
          export TOP_INNER_ID="$(jq -r '.directDemand.placements.quick_sticky_top.candidates[0].tag.attributes["data-hm-gpt-inner-id"]' production.json)"
          export TOP_AD_UNIT="$(jq -r '.directDemand.placements.quick_sticky_top.candidates[0].tag.attributes["data-hm-gpt-ad-unit-path"]' production.json)"
          export TOP_SIZES="$(jq -c '.directDemand.placements.quick_sticky_top.candidates[0].tag.render.allowedSizes' production.json)"
          export TOP_MAP="$(jq -c '.placements[] | select(.code=="quick_sticky_top") | .responsiveMappings' production.json)"
          cat > .probe.mjs <<'JS'
          import { chromium, webkit } from '@playwright/test';
          import fs from 'node:fs';
          const browserName = process.env.BROWSER_NAME;
          const engine = browserName === 'webkit' ? webkit : chromium;
          const browser = await engine.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});
          const page = await context.newPage();
          const events=[];
          page.on('response',r=>{const u=r.url();if(/doubleclick|googlesyndication|securepubads|gampad|horus/i.test(u))events.push({type:'response',status:r.status(),url:u});});
          page.on('requestfailed',r=>{const u=r.url();if(/doubleclick|googlesyndication|securepubads|gampad|horus/i.test(u))events.push({type:'failed',url:u,error:r.failure()?.errorText||null});});
          page.on('console',m=>events.push({type:'console',level:m.type(),text:m.text()}));
          const esc=(v)=>String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
          const html=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#eee;min-height:844px"><div id="anchor-shell" style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2147483000"><div id="${esc(process.env.TOP_CONTAINER_ID)}" data-hm-gpt-direct="1" data-hm-gpt-ad-unit-path="${esc(process.env.TOP_AD_UNIT)}" data-hm-gpt-sizes="${esc(process.env.TOP_SIZES)}" data-hm-gpt-inner-id="${esc(process.env.TOP_INNER_ID)}" data-hm-gpt-size-map="${esc(process.env.TOP_MAP)}"></div></div><script src="${esc(process.env.RUNTIME_URL)}"></script><main style="padding-top:180px;font:24px sans-serif">Direct GPT probe</main></body></html>`;
          await page.route('https://lordai.net/**',async route=>{if(route.request().isNavigationRequest()){await route.fulfill({status:200,contentType:'text/html',body:html});return;}await route.continue();});
          await page.goto('https://lordai.net/',{waitUntil:'domcontentloaded',timeout:60000});
          const snapshots=[];
          for(const delay of [500,1500,3000,6000,12000]){
            await page.waitForTimeout(delay-(snapshots.length? [500,1500,3000,6000][snapshots.length-1]:0));
            snapshots.push(await page.evaluate(()=>{
              const d=document.querySelector('[data-hm-gpt-direct="1"]'); const s=d&&d.shadowRoot; const f=s&&s.querySelector('iframe'); let body=null, kids=[];
              try{const doc=f&&f.contentDocument;body=doc&&doc.body?doc.body.innerHTML.slice(0,8000):null;kids=doc?Array.from(doc.querySelectorAll('iframe')).map(x=>({id:x.id,name:x.name,width:x.getBoundingClientRect().width,height:x.getBoundingClientRect().height,src:x.src||null})):[];}catch(e){body='ERR:'+e;}
              const r=d&&d.getBoundingClientRect(); const fr=f&&f.getBoundingClientRect();
              return {t:performance.now(),attrs:d?Object.fromEntries(Array.from(d.attributes).map(a=>[a.name,a.value])):null,rect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,frame:fr?{x:fr.x,y:fr.y,width:fr.width,height:fr.height}:null,frameBody:body,childFrames:kids};
            }));
          }
          const report={browser:browserName,snapshots,events};
          fs.writeFileSync(`probe-${browserName}.json`,JSON.stringify(report,null,2));
          await page.screenshot({path:`probe-${browserName}.png`,fullPage:false});
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          JS
          node .probe.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lordai-gpt-probe-${{ matrix.browser }}
          path: |
            probe-${{ matrix.browser }}.json
            probe-${{ matrix.browser }}.png
            production.json
            hm-gpt-runtime.js
          retention-days: 7
