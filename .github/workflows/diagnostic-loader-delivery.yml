name: Diagnose loader delivery mismatch
on:
  push:
    branches: [diagnostic/loader-delivery-20260930]
    paths: [.github/workflows/diagnostic-loader-delivery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9a7bbbddbc7c080d006cfd05662badebe2177ac5
          persist-credentials: false
      - name: Read public serving assets without executing advertising
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git archive HEAD | gzip > evidence/reviewed-main-source.tar.gz
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request, urllib.error
          from html.parser import HTMLParser
          out = pathlib.Path('evidence')
          targets = [
            ('publisher', 'https://natega.bluekl.com/'),
            ('cdn-loader', 'https://cdn.horusmedia.net/hm-loader.js'),
            ('previous-loader', 'https://b73ce6c2.horus-media-cdn.pages.dev/hm-loader.js'),
            ('deployed-loader', 'https://728a706f.horus-media-cdn.pages.dev/hm-loader.js'),
            ('pages-main-loader', 'https://horus-media-cdn.pages.dev/hm-loader.js'),
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          class Scripts(HTMLParser):
            def __init__(self): super().__init__(); self.scripts=[]
            def handle_starttag(self, tag, attrs):
              a=dict(attrs)
              if tag=='script' and ('data-site-key' in a or 'hm-loader' in a.get('src','')):
                self.scripts.append({k:a[k] for k in ['src','data-site-key','data-environment','data-config-base','async','defer','type'] if k in a})
          def get(t):
            name,url=t
            row={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Horus-Delivery-Diagnostic/1.0','Accept-Encoding':'identity'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as r:
                b=r.read(2000001)
                if len(b)>2000000: raise ValueError('Body exceeds bound')
                row.update(status=r.status,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                row['headers']={k:r.headers.get(k) for k in ['Content-Type','Cache-Control','Age','CF-Cache-Status','CF-Mitigated','ETag','Last-Modified','Vary','Location'] if r.headers.get(k)}
                if name=='publisher':
                  p=Scripts(); p.feed(b.decode('utf8','replace')); row['horusScripts']=p.scripts
                elif r.status==200 and 'javascript' in r.headers.get('Content-Type',''):
                  (out/(name+'.js')).write_bytes(b)
            except urllib.error.HTTPError as e:
              row.update(status=e.code,outcome='request_rejected')
              row['headers']={k:e.headers.get(k) for k in ['Content-Type','Cache-Control','CF-Mitigated','Location'] if e.headers.get(k)}
            except Exception as e: row.update(outcome='transport_error',error_type=type(e).__name__)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: rows=list(pool.map(get,targets))
          (out/'public-requests.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Compute signatures in a networkless VM
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import vm from 'node:vm'; import crypto from 'node:crypto';
          const results=[];
          for (const label of ['cdn-loader','previous-loader','deployed-loader','pages-main-loader']) {
            const path=`evidence/${label}.js`; if(!fs.existsSync(path)) continue;
            const window={__HM_DISABLE_AUTOBOOT__:true}, document={};
            try {
              vm.runInNewContext(fs.readFileSync(path,'utf8'),{window,document,URL},{timeout:1500,codeGeneration:{strings:false,wasm:false}});
              const loader=window.HorusMediaLoader;
              const source=['boot','refresh','scan','getStartupTrace','_resetForTests'].map(name=>name+':'+(typeof loader?.[name]==='function'?Function.prototype.toString.call(loader[name]):'missing')).join('\n');
              const signature=crypto.createHash('sha256').update(source).digest('hex');
              results.push({label,version:loader?.version,signature,matchesVisitor:signature==='022c52ab44e24eb400a22107ccc98c6d22e379556d7ac3cf96fe5fe6424f7762',matchesPR219:signature==='6499ce30c38d1f533f46925ebe351cc353a96e05916aaca91a85cb3d8cfb68c1'});
            } catch(e) {results.push({label,error:e.name});}
          }
          fs.writeFileSync('evidence/signatures.json',JSON.stringify(results,null,2)); console.log(JSON.stringify(results,null,2));
          JS
      - name: Retain bounded public-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loader-delivery-diagnostic
          path: evidence/
          retention-days: 7
          if-no-files-found: error
