name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Authenticate Composer to GitHub at runtime so locked dependency fetches are
  # not subject to the lower anonymous GitHub API limit. The token is ephemeral
  # and never written to repository files or release artifacts.
  COMPOSER_AUTH: >-
    {"github-oauth":{"github.com":"${{ github.token }}"}}
  COMPOSER_MAX_PARALLEL_HTTP: 2

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php: [8.2, 8.3, 8.4]
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, openssl, soap
          coverage: none
      - name: Install Composer dependencies
        run: bash scripts/install-composer-ci.sh
      - name: Copy environment file
        run: cp .env.example .env
      - name: Generate app key
        run: php artisan key:generate
      - name: Execute tests
        run: php artisan test

  deployment-foundation:
    runs-on: ubuntu-latest
    name: Atomic deployment foundation
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate deployment tooling syntax
        run: |
          bash -n ops/deploy/horus-atomic-deploy.sh
          bash -n ops/deploy/horus-bootstrap-atomic-layout.sh
          php -l ops/deploy/write-mysql-client-config.php
      - name: Execute atomic deployment regression tests
        run: |
          bash tests/Deployment/bootstrap-layout-test.sh
          bash tests/Deployment/atomic-deploy-test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Execute Horus Loader browser tests
        run: npm run test:browser
      - name: Build production assets, custom Prebid, and minified loader
        run: npm run build
      - name: Verify browser distributions
        run: |
          test -s public/assets/hm-loader.js
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.js
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/horus-prebid.sha256

  traffic-gate-real-browsers:
    runs-on: ubuntu-latest
    name: Traffic Gate Chromium + WebKit
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install pinned CI-only Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Execute deterministic Traffic Gate real-browser matrix
        run: npx playwright test --config=playwright.traffic-gate.config.js

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: horus_test
          MYSQL_USER: horus
          MYSQL_PASSWORD: horus_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorus -phorus_test_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl, soap
          coverage: none
      - name: Install Composer dependencies
        run: bash scripts/install-composer-ci.sh
      - name: Copy environment file
        run: cp .env.example .env
      - name: Run MySQL migrations and tests
        env:
          APP_ENV: testing
          APP_KEY: base64:TjdJVrvlPuNPVt+Rh3VHiJyInFSQGaWPYIhDf49E48M=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: horus_test
          DB_USERNAME: horus
          DB_PASSWORD: horus_test_password
        run: |
          php scripts/assert-database-connection.php mysql
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
          php artisan test

  release-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, mysql, frontend, traffic-gate-real-browsers, deployment-foundation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, soap
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: bash scripts/install-composer-ci.sh --no-dev
      - run: npm ci && npm run test:browser && npm run build
      - name: Verify compiled Prebid release files
        run: test -s public/assets/prebid/horus-prebid.min.js && test -s public/assets/prebid/horus-prebid.sha256
      - name: Create and validate canonical production release
        run: |
          ./scripts/build-release.sh
          ./scripts/validate-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: horus-media-release-${{ github.sha }}
          path: |
            release/horus-media-platform.zip
            release/CHECKSUMS.txt
            release/*.md
          retention-days: 14
