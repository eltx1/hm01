name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, soap, openssl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Copy environment file
        run: cp .env.example .env
      - name: Generate app key
        run: php artisan key:generate
      - name: Execute tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Execute Horus Loader and Prebid browser tests
        run: npm run test:browser
      - name: Build production assets and minified loader
        run: npm run build
      - name: Build pinned custom Prebid distribution
        run: npm run build:prebid
      - name: Verify browser distributions
        run: |
          test -s public/assets/hm-loader.js
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.js
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/manifest.json
          node -e "const m=require('./public/assets/prebid/manifest.json'); if(m.version!=='horus-11.14.0-1'||!m.checksum||!m.modules.includes('gptPreAuction')) process.exit(1)"

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: horus_test
          MYSQL_USER: horus
          MYSQL_PASSWORD: horus_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhorus -phorus_test_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, soap, openssl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run MySQL migrations and tests
        env:
          APP_ENV: testing
          APP_KEY: base64:TjdJVrvlPuNPVt+Rh3VHiJyInFSQGaWPYIhDf49E48M=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: horus_test
          DB_USERNAME: horus
          DB_PASSWORD: horus_test_password
        run: |
          php artisan migrate:fresh --seed --force
          php artisan test

  release-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, mysql, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: soap, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: npm ci && npm run test:browser && npm run build && npm run build:prebid
      - name: Validate compiled Prebid release
        run: |
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/manifest.json
      - name: Create portable production release
        run: zip -qr horus-media-release.zip . -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' '.env' '*.log' 'prebid-builds/source/*'
      - uses: actions/upload-artifact@v4
        with:
          name: horus-media-release-${{ github.sha }}
          path: horus-media-release.zip
          retention-days: 14
