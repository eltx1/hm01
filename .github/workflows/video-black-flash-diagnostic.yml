name: Isolated video black-flash diagnosis
on:
  push:
    branches: [diagnostic/video-black-flash-20260929]
    paths: [.github/workflows/video-black-flash-diagnostic.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/hm01-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: video-black-flash-source
          path: ${{ runner.temp }}/hm01-source.tar.gz
          retention-days: 2
