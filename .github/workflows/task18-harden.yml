name: Task18 Harden

'on':
  push:
    branches:
      - task-18-direct-demand-admin-control-center

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-18-direct-demand-admin-control-center
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, soap
      - name: Apply and lint
        run: |
          python3 scripts/task18_harden.py
          php -l app/Http/Controllers/Admin/DemandNetworkController.php
          php -l app/Services/Demand/DemandAccountService.php
          php -l app/Services/Monetization/SiteMonetizationReadinessService.php
      - name: Commit
        run: |
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 18: harden Direct Demand controls and Admin workflows"
          git push origin HEAD:task-18-direct-demand-admin-control-center
