name: Bootstrap production atomic layout

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection or one-time atomic bootstrap
        required: true
        type: choice
        options:
          - inspect
          - bootstrap
      confirmed_verified_backups:
        description: Confirm verified DB, .env, and storage backups exist
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: horus-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      EXPECTED_HOST_FINGERPRINT: ${{ vars.HORUS_PRODUCTION_SSH_HOST_ED25519_FINGERPRINT }}
      DEPLOY_PUBLIC_KEY: ${{ vars.HORUS_PRODUCTION_SSH_PUBLIC_KEY }}
      HEALTH_URL: ${{ vars.HORUS_PRODUCTION_HEALTH_URL || 'https://app.horusmedia.net/up' }}
      ORIGIN_HEALTH_RESOLVE_IP: ${{ vars.HORUS_PRODUCTION_ORIGIN_HEALTH_RESOLVE_IP || '127.0.0.1' }}
      ORIGIN_HEALTH_INSECURE_TLS: ${{ vars.HORUS_PRODUCTION_ORIGIN_HEALTH_INSECURE_TLS || '0' }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.operation }}" == 'inspect' || "${{ inputs.operation }}" == 'bootstrap' ]]
          if [[ "${{ inputs.operation }}" == 'bootstrap' ]]; then
            [[ "${{ inputs.confirmed_verified_backups }}" == 'true' ]]
          fi
          [[ -n "$HOST" ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == '/home/horusapp' ]]
          [[ "$ORIGIN_HEALTH_RESOLVE_IP" =~ ^[0-9A-Fa-f:.]+$ ]]
          [[ "$ORIGIN_HEALTH_INSECURE_TLS" == '0' || "$ORIGIN_HEALTH_INSECURE_TLS" == '1' ]]
          [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]

      - name: Configure pinned administrator SSH
        shell: bash
        env:
          ADMIN_SSH_KEY: ${{ secrets.HORUS_BOOTSTRAP_ADMIN_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_SSH_KEY:-}"
          test -n "${KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ADMIN_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify pinned server host identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(ssh -p "$SSH_PORT" ubuntu@"$HOST" \
            "ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print \$2}'")"
          [[ "$actual" == "$EXPECTED_HOST_FINGERPRINT" ]]

      - name: Inspect current production state
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" ubuntu@"$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          current=/home/horusapp/htdocs/app.horusmedia.net
          test -d "$current"
          test -f "$current/artisan"
          test -f "$current/.env"
          test -d "$current/storage"
          if [[ -L "$current" ]]; then
            printf 'application_layout=symlink\n'
            printf 'active_release=%s\n' "$(readlink -f "$current")"
          else
            printf 'application_layout=directory\n'
          fi
          sudo -u horusapp -H /usr/bin/php8.4 "$current/artisan" about --only=environment >/dev/null
          sudo -u horusapp -H /usr/bin/php8.4 "$current/artisan" schedule:list >/dev/null
          sudo -u horusapp -H /usr/bin/php8.4 "$current/artisan" queue:failed
          curl -kfsS --noproxy '*' --resolve app.horusmedia.net:443:127.0.0.1 \
            https://app.horusmedia.net/up >/dev/null
          printf 'origin_health=ok\n'
          if [[ -d /home/horusapp/backups ]]; then
            find /home/horusapp/backups -maxdepth 3 -type f -size +0c \
              -printf 'backup=%p bytes=%s\n' | sort
          fi
          REMOTE

      - name: Verify backup evidence before conversion
        if: inputs.operation == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" ubuntu@"$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          backup_root=/home/horusapp/backups
          test -d "$backup_root"

          sql_file="$(find "$backup_root" -maxdepth 3 -type f \
            \( -name '*.sql' -o -name '*.sql.gz' \) -size +128c -print -quit)"
          env_file="$(find "$backup_root" -maxdepth 3 -type f \
            \( -name '.env' -o -name '*.env' -o -name '*.env.backup' \) -size +0c -print -quit)"
          storage_file="$(find "$backup_root" -maxdepth 3 -type f \
            \( -name '*storage*.tar.gz' -o -name '*storage*.tgz' \) -size +0c -print -quit)"

          test -n "$sql_file"
          test -n "$env_file"
          test -n "$storage_file"

          if [[ "$sql_file" == *.gz ]]; then
            gzip -t "$sql_file"
            gzip -cd "$sql_file" | grep -aEq 'CREATE TABLE|INSERT INTO|SQL dump|MariaDB dump'
          else
            grep -aEq 'CREATE TABLE|INSERT INTO|SQL dump|MariaDB dump' "$sql_file"
          fi
          tar -tzf "$storage_file" >/dev/null
          printf 'verified_database_backup=%s\n' "$sql_file"
          printf 'verified_environment_backup=%s\n' "$env_file"
          printf 'verified_storage_backup=%s\n' "$storage_file"
          REMOTE

      - name: Install dedicated deployment public key
        if: inputs.operation == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+\ github-actions@horusmedia.net$ ]]
          key_file="$RUNNER_TEMP/horus-production-deploy.pub"
          printf '%s\n' "$DEPLOY_PUBLIC_KEY" > "$key_file"
          chmod 600 "$key_file"
          scp -P "$SSH_PORT" "$key_file" ubuntu@"$HOST":/tmp/horus-production-deploy.pub
          ssh -p "$SSH_PORT" ubuntu@"$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo install -d -m 700 -o horusapp -g horusapp /home/horusapp/.ssh
          sudo touch /home/horusapp/.ssh/authorized_keys
          sudo chown horusapp:horusapp /home/horusapp/.ssh/authorized_keys
          sudo chmod 600 /home/horusapp/.ssh/authorized_keys
          if ! sudo grep -qxF -f /tmp/horus-production-deploy.pub /home/horusapp/.ssh/authorized_keys; then
            sudo tee -a /home/horusapp/.ssh/authorized_keys < /tmp/horus-production-deploy.pub >/dev/null
          fi
          rm -f /tmp/horus-production-deploy.pub
          REMOTE

      - name: Transfer exact merged bootstrap script
        if: inputs.operation == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/bootstrap-${{ github.sha }}"
          ssh -p "$SSH_PORT" ubuntu@"$HOST" \
            "sudo -u horusapp -H mkdir -p '$remote_dir' && sudo -u horusapp -H chmod 700 '$REMOTE_HOME/incoming' '$remote_dir'"
          scp -P "$SSH_PORT" ops/deploy/horus-bootstrap-atomic-layout.sh \
            ubuntu@"$HOST":/tmp/horus-bootstrap-atomic-layout.sh
          ssh -p "$SSH_PORT" ubuntu@"$HOST" \
            "sudo install -m 700 -o horusapp -g horusapp /tmp/horus-bootstrap-atomic-layout.sh \
              '$remote_dir/horus-bootstrap-atomic-layout.sh' && rm -f /tmp/horus-bootstrap-atomic-layout.sh"

      - name: Convert production to the atomic layout
        if: inputs.operation == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$REMOTE_HOME/incoming/bootstrap-${{ github.sha }}/horus-bootstrap-atomic-layout.sh"
          ssh -p "$SSH_PORT" ubuntu@"$HOST" \
            "sudo -u horusapp -H env \
             HORUS_BOOTSTRAP_CONFIRMED_BACKUP=1 \
             HORUS_DEPLOY_HOME='$REMOTE_HOME' \
             HORUS_DEPLOY_HEALTH_RESOLVE_IP='$ORIGIN_HEALTH_RESOLVE_IP' \
             HORUS_DEPLOY_HEALTH_INSECURE_TLS='$ORIGIN_HEALTH_INSECURE_TLS' \
             bash '$remote_script'"

      - name: Verify atomic production state
        if: inputs.operation == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" ubuntu@"$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          current=/home/horusapp/htdocs/app.horusmedia.net
          test -L "$current"
          target="$(readlink -f "$current")"
          [[ "$target" == /home/horusapp/releases/* ]]
          [[ "$(readlink -f "$current/.env")" == /home/horusapp/shared/.env ]]
          [[ "$(readlink -f "$current/storage")" == /home/horusapp/shared/storage ]]
          [[ "$(readlink -f "$current/public/storage")" == /home/horusapp/shared/storage/app/public ]]
          sudo -u horusapp -H /usr/bin/php8.4 "$current/artisan" schedule:list >/dev/null
          sudo -u horusapp -H /usr/bin/php8.4 "$current/artisan" queue:failed
          curl -kfsS --noproxy '*' --resolve app.horusmedia.net:443:127.0.0.1 \
            https://app.horusmedia.net/up >/dev/null
          printf 'active_release=%s\n' "$target"
          REMOTE
          curl -fsS --retry 5 --retry-delay 2 --max-time 15 "$HEALTH_URL" >/dev/null
