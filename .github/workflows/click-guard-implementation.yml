name: Click Guard Implementation

on:
  push:
    branches:
      - agent/horus-click-guard

permissions:
  contents: write

jobs:
  implement-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/horus-click-guard
          fetch-depth: 0
      - name: Apply implementation
        run: |
          rm -f tests/.click-guard-test-output.txt
          python scripts/apply-click-guard.py
      - name: Harden generated test harness
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('public/assets/hm-loader.js')
          source = loader.read_text()
          source = source.replace(
              "if (!state.clickGuard.settings || !state.clickGuard.settings.enabled || !Array.isArray(mutations) && !mutations.length) return;",
              "if (!state.clickGuard.settings || !state.clickGuard.settings.enabled || !mutations || !mutations.length) return;",
          )
          loader.write_text(source)

          test_file = Path('tests/Browser/hm-loader-click-guard.test.js')
          test_source = test_file.read_text()
          test_source = test_source.replace(
              "        setTimeout, clearTimeout,\n        setInterval(callback)",
              "        setTimeout(callback, delay, ...args) { if (Number(delay) > 5000) return { __hmLongTimer: true }; return setTimeout(callback, delay, ...args); },\n        clearTimeout(id) { if (!id?.__hmLongTimer) clearTimeout(id); },\n        setInterval(callback)",
          )
          test_file.write_text(test_source)
          PY
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run browser tests
        run: npm run test:browser
      - name: Rebuild minified loader
        run: npm run build:loader
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, openssl, soap
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: cp .env.example .env && php artisan key:generate
      - name: Run PHP tests
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee tests/.click-guard-test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/.click-guard-test-output.txt
            git commit -m "Capture Click Guard PHP test failure"
            git push origin HEAD:agent/horus-click-guard
            exit "$status"
          fi
      - name: Commit implementation and generated loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tests/.click-guard-test-output.txt
          git add app database docs public resources tests
          git commit -m "Implement Horus Click Guard"
          git push origin HEAD:agent/horus-click-guard
