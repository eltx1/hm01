name: Harden native demand public tags

on:
  push:
    branches:
      - agent/fix-native-demand-complete

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/fix-native-demand-complete

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Apply native tag hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          connector = Path('app/Services/Demand/AbstractDemandConnector.php')
          text = connector.read_text()
          old = "            ->reject(fn ($value, $key) => preg_match('/^(?:on|srcdoc$)|secret|token|password|credential|key/i', (string) $key))"
          new = "            ->reject(fn ($value, $key) => preg_match('/^(?:on|src$|srcdoc$|href$|integrity$|nonce$)|secret|token|password|credential|key/i', (string) $key))"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one public attribute filter, found {text.count(old)}')
          connector.write_text(text.replace(old, new))

          loader = Path('public/assets/hm-loader.js')
          text = loader.read_text()
          old = """        Object.keys(attributes).forEach(function (key) {
            if (/^[A-Za-z_:][-A-Za-z0-9_:.]*$/.test(key)) script.setAttribute(key, String(attributes[key]));
        });"""
          new = """        Object.keys(attributes).forEach(function (key) {
            var value = String(attributes[key]);
            if (!/^[A-Za-z_:][-A-Za-z0-9_:.]*$/.test(key)) return;
            if (/^(?:on|src$|srcdoc$|href$|integrity$|nonce$)|secret|token|password|credential|key/i.test(key)) return;
            if (/javascript\s*:/i.test(value)) return;
            script.setAttribute(key, value);
        });"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one loader attribute block, found {text.count(old)}')
          loader.write_text(text.replace(old, new))

          browser = Path('tests/Browser/hm-loader-native.test.js')
          text = browser.read_text()
          old = "                setAttribute(name, value) { attributes[name] = String(value); },"
          new = "                setAttribute(name, value) { attributes[name] = String(value); if (name === 'src') this.src = String(value); },"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one dynamic script setAttribute implementation, found {text.count(old)}')
          text = text.replace(old, new)
          addition = """

test('unsafe public attributes cannot override an allowlisted native script URL', async () => {
    const candidates = [{
        network: 'MGID', mode: 'DIRECT_JS', priority: 10, gamManaged: false,
        tag: {
            scriptUrl: 'https://jsc.mgid.com/safe.js',
            containerId: 'mgid-safe',
            renderTimeoutMs: 1,
            attributes: { src: 'https://evil.example/override.js', onload: 'steal()', 'data-widget': 'safe' },
        },
    }];
    const { sandbox, metrics, placement } = harness(selectedConfig({ candidates }));
    await sandbox.HorusMediaLoader.boot();

    assert.equal(metrics.nativeLoads.length, 1);
    assert.equal(metrics.nativeLoads[0].src, 'https://jsc.mgid.com/safe.js');
    assert.equal(placement.getAttribute('data-hm-native'), 'MGID');
});
"""
          if "unsafe public attributes cannot override" in text:
              raise SystemExit('Browser hardening test already exists')
          browser.write_text(text + addition)

          feature = Path('tests/Feature/DemandNetworkSystemTest.php')
          text = feature.read_text()
          marker = "        $payload = app(SiteConfigurationBuilder::class)->build($site->fresh(), ConfigEnvironment::Production, 1);"
          replacement = """        $configuration = $account->configuration;
        $configuration['attributes'] = [
            'src' => 'https://evil.example/override.js',
            'onload' => 'steal()',
            'data-widget' => 'approved-public-value',
        ];
        $account->update(['configuration' => $configuration]);

        $payload = app(SiteConfigurationBuilder::class)->build($site->fresh(), ConfigEnvironment::Production, 1);"""
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one feature payload marker, found {text.count(marker)}')
          text = text.replace(marker, replacement)
          assertion_marker = "        $this->assertSame('https://jsc.mgid.com/publisher.example/article.js', data_get($candidate, 'tag.scriptUrl'));"
          assertion = assertion_marker + "\n        $this->assertSame(['data-widget' => 'approved-public-value'], data_get($candidate, 'tag.attributes'));"
          if text.count(assertion_marker) != 1:
              raise SystemExit(f'Expected one feature URL assertion, found {text.count(assertion_marker)}')
          feature.write_text(text.replace(assertion_marker, assertion))
          PY

          php -l app/Services/Demand/AbstractDemandConnector.php
          php -l tests/Feature/DemandNetworkSystemTest.php
          node --check public/assets/hm-loader.js
          node --check tests/Browser/hm-loader-native.test.js

      - name: Install dependencies and run focused checks
        shell: bash
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/DemandNetworkSystemTest.php
          npm ci
          npm run build
          node --test tests/Browser/hm-loader-native.test.js

      - name: Commit hardening and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/native-demand-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden native demand public tag attributes"
          git push origin HEAD:agent/fix-native-demand-complete
