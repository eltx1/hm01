name: Validate independent ad startup
on:
  push:
    branches: [diagnostic/video-black-flash-20260929]
    paths: [.github/workflows/parallel-startup-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b713dbf46e2227e533754388f8e87484621650f2
          path: code
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 570619d8e863cc83cfbfab11858c7540c1b46d85
          path: staging
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify patch bytes and run source regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,os
          encoded=pathlib.Path('staging/diagnostics/parallel-startup.patch.gz.base64').read_text().strip()
          # Repair the single recorded transport transcription; the immutable
          # decoded SHA below remains the authority for every byte applied.
          encoded=encoded.replace('IIXYNYxM1','IIXYNxM1',1)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='9681a072c6f6bc95adcb32f38dffb186b068a8c3f0d086d9e4923471ac3a3781'
          pathlib.Path(os.environ['RUNNER_TEMP'],'parallel-startup.patch').write_bytes(patch)
          PY
          cd code
          git apply --check "$RUNNER_TEMP/parallel-startup.patch"
          git apply "$RUNNER_TEMP/parallel-startup.patch"
          node --test tests/Browser/hm-loader-startup-preparation.test.js tests/Browser/hm-loader-traffic-gate.test.js tests/Browser/hm-direct-trusted-runtimes.test.js | tee "$RUNNER_TEMP/parallel-node.log"
      - uses: actions/upload-artifact@v7
        with:
          name: parallel-startup-validated
          path: |
            ${{ runner.temp }}/parallel-startup.patch
            ${{ runner.temp }}/parallel-node.log
          retention-days: 7
          if-no-files-found: error
  publish-review-update:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b713dbf46e2227e533754388f8e87484621650f2
      - uses: actions/download-artifact@v8
        with:
          name: parallel-startup-validated
          path: validated
      - name: Update only the existing review branch without forcing
        shell: bash
        run: |
          set -euo pipefail
          echo '9681a072c6f6bc95adcb32f38dffb186b068a8c3f0d086d9e4923471ac3a3781  validated/parallel-startup.patch' | sha256sum -c -
          branch=fix/video-playback-recovery-review-20260929
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = b713dbf46e2227e533754388f8e87484621650f2
          git apply --check validated/parallel-startup.patch
          git apply validated/parallel-startup.patch
          git add public/assets/hm-loader.js public/assets/hm-video-direct.js scripts/transform-loader-video-preparation.mjs tests/Browser/hm-loader-startup-preparation.test.js tests/Browser/hm-loader-traffic-gate.test.js tests/Browser/startup-recovery.playwright.spec.js
          python - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths=={'public/assets/hm-loader.js','public/assets/hm-video-direct.js','scripts/transform-loader-video-preparation.mjs','tests/Browser/hm-loader-startup-preparation.test.js','tests/Browser/hm-loader-traffic-gate.test.js','tests/Browser/startup-recovery.playwright.spec.js'}
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep independent ad startup fair and remove pre-verification video reservations'
          git push origin "HEAD:refs/heads/$branch"
