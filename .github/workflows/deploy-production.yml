name: Deploy production

on:
  workflow_run:
    workflows:
      - Production release validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Production release validation run ID
        required: true
        type: string
      release_sha:
        description: Commit SHA produced by that validation run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: horus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.HORUS_PRODUCTION_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      HEALTH_URL: ${{ vars.HORUS_PRODUCTION_HEALTH_URL || 'https://app.horusmedia.net/up' }}

    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download validated production artifact
        uses: actions/download-artifact@v8
        with:
          name: horus-media-platform-${{ env.RELEASE_SHA }}
          path: artifact
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify validated artifact checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          sha256sum -c release/CHECKSUMS.txt
          sha="$(sha256sum release/horus-media-platform.zip | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}"
          test -n "${KNOWN_HOSTS:-}"
          test -n "${{ secrets.HORUS_PRODUCTION_HOST }}"
          test -n "${{ secrets.HORUS_PRODUCTION_SSH_USER }}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer validated release and deployment tooling
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/$RELEASE_SHA"
          ssh -p "$SSH_PORT" "$USER@$HOST" "mkdir -p '$remote_dir' && chmod 700 '$REMOTE_HOME/incoming' '$remote_dir'"
          scp -P "$SSH_PORT" artifact/release/horus-media-platform.zip \
            ops/deploy/horus-atomic-deploy.sh \
            ops/deploy/write-mysql-client-config.php \
            "$USER@$HOST:$remote_dir/"

      - name: Deploy atomically on production host
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/$RELEASE_SHA"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "chmod 700 '$remote_dir/horus-atomic-deploy.sh' && \
             HORUS_RELEASE_ID='$RELEASE_SHA' \
             HORUS_DEPLOY_HOME='$REMOTE_HOME' \
             HORUS_DEPLOY_MYSQL_CONFIG_HELPER='$remote_dir/write-mysql-client-config.php' \
             '$remote_dir/horus-atomic-deploy.sh' \
             '$remote_dir/horus-media-platform.zip' '$ARTIFACT_SHA256'"

      - name: Verify public production health
        shell: bash
        run: curl -fsS --retry 5 --retry-delay 2 --max-time 15 "$HEALTH_URL" >/dev/null

      - name: Remove transferred package
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          if [[ -n "${HOST:-}" && -n "${USER:-}" ]]; then
            ssh -p "$SSH_PORT" "$USER@$HOST" "rm -rf '$REMOTE_HOME/incoming/$RELEASE_SHA'" || true
          fi
