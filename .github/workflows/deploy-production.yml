name: Deploy production

on:
  workflow_run:
    workflows:
      - Production release validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Production release validation run ID
        required: true
        type: string
      release_sha:
        description: Commit SHA produced by that validation run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: horus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual dispatch is always available for the first controlled deployment.
    # Automatic workflow_run deployment remains fail-safe OFF until the owner
    # explicitly enables HORUS_PRODUCTION_DEPLOY_ENABLED after that drill.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (vars.HORUS_PRODUCTION_DEPLOY_ENABLED == 'true' &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      HEALTH_URL: ${{ vars.HORUS_PRODUCTION_HEALTH_URL || 'https://app.horusmedia.net/up' }}
      ORIGIN_HEALTH_RESOLVE_IP: ${{ vars.HORUS_PRODUCTION_ORIGIN_HEALTH_RESOLVE_IP || '127.0.0.1' }}
      ORIGIN_HEALTH_INSECURE_TLS: ${{ vars.HORUS_PRODUCTION_ORIGIN_HEALTH_INSECURE_TLS || '0' }}

    steps:
      - name: Validate deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$HEALTH_URL" == 'https://app.horusmedia.net/up' ]]
          [[ "$ORIGIN_HEALTH_RESOLVE_IP" =~ ^[0-9A-Fa-f:.]+$ ]]
          [[ "$ORIGIN_HEALTH_INSECURE_TLS" == '0' || "$ORIGIN_HEALTH_INSECURE_TLS" == '1' ]]

      - name: Require successful main production validation
        uses: actions/github-script@v8
        with:
          script: |
            const runId = Number(process.env.RELEASE_RUN_ID);
            const expectedSha = process.env.RELEASE_SHA;
            const { data } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const failures = [];
            if (data.name !== 'Production release validation') failures.push(`workflow=${data.name}`);
            if (data.conclusion !== 'success') failures.push(`conclusion=${data.conclusion}`);
            if (data.head_branch !== 'main') failures.push(`branch=${data.head_branch}`);
            if (data.head_sha !== expectedSha) failures.push(`sha=${data.head_sha}`);

            if (failures.length > 0) {
              core.setFailed(`Release run is not an approved successful main validation: ${failures.join(', ')}`);
            }

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download validated production artifact
        uses: actions/download-artifact@v8
        with:
          name: horus-media-platform-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/horus-artifact
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify validated artifact checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/horus-artifact"
          test -s "$artifact_dir/horus-media-platform.zip"
          test -s "$artifact_dir/CHECKSUMS.txt"
          expected="$(awk 'NF >= 1 {print $1; exit}' "$artifact_dir/CHECKSUMS.txt")"
          actual="$(sha256sum "$artifact_dir/horus-media-platform.zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$actual" != "$expected" ]]; then
            echo "Validated artifact checksum mismatch." >&2
            exit 1
          fi
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}"
          test -n "${KNOWN_HOSTS:-}"
          test -n "${HOST:-}"
          test -n "${USER:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer validated release and deployment tooling
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/$RELEASE_SHA"
          artifact_dir="$RUNNER_TEMP/horus-artifact"
          ssh -p "$SSH_PORT" "$USER@$HOST" "mkdir -p '$remote_dir' && chmod 700 '$REMOTE_HOME/incoming' '$remote_dir'"
          scp -P "$SSH_PORT" "$artifact_dir/horus-media-platform.zip" \
            ops/deploy/horus-atomic-deploy.sh \
            ops/deploy/write-mysql-client-config.php \
            "$USER@$HOST:$remote_dir/"

      - name: Deploy atomically on production host
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/$RELEASE_SHA"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "chmod 700 '$remote_dir/horus-atomic-deploy.sh' && \
             HORUS_RELEASE_ID='$RELEASE_SHA' \
             HORUS_DEPLOY_HOME='$REMOTE_HOME' \
             HORUS_DEPLOY_HEALTH_RESOLVE_IP='$ORIGIN_HEALTH_RESOLVE_IP' \
             HORUS_DEPLOY_HEALTH_INSECURE_TLS='$ORIGIN_HEALTH_INSECURE_TLS' \
             HORUS_DEPLOY_MYSQL_CONFIG_HELPER='$remote_dir/write-mysql-client-config.php' \
             '$remote_dir/horus-atomic-deploy.sh' \
             '$remote_dir/horus-media-platform.zip' '$ARTIFACT_SHA256'"

      - name: Probe public production edge
        shell: bash
        # The atomic deploy already performs the authoritative direct-origin
        # application health check and rolls back on failure. This additional
        # strict-TLS edge probe must not invalidate a healthy release when
        # Cloudflare intentionally denies the production host itself with 403.
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          status="$(ssh -p "$SSH_PORT" "$USER@$HOST" \
            "curl -sS --retry 5 --retry-delay 2 --max-time 15 \
              --user-agent 'Horus-Production-Deploy/1.0' \
              --output /dev/null --write-out '%{http_code}' '$HEALTH_URL'")"

          case "$status" in
            200)
              echo "Public production health returned HTTP 200."
              ;;
            403)
              echo "::warning::Cloudflare denied the production host edge probe with HTTP 403; authoritative origin health passed."
              ;;
            *)
              echo "Unexpected public production health status: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Remove transferred package
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          if [[ -n "${HOST:-}" && -n "${USER:-}" ]]; then
            ssh -p "$SSH_PORT" "$USER@$HOST" "rm -rf '$REMOTE_HOME/incoming/$RELEASE_SHA'" || true
          fi
