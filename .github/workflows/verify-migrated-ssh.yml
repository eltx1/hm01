name: Verify migrated SSH
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Verify unchanged deployment key and server identity
        shell: bash
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          EXPECTED_USER: horusapp
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "13.63.216.89"
          test -n "$SSH_KEY"
          install -d -m 700 "$RUNNER_TEMP/migration-ssh"
          key="$RUNNER_TEMP/migration-ssh/key"
          known="$RUNNER_TEMP/migration-ssh/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"
          actual="$(ssh-keygen -lf "$known" -E sha256 | awk 'NR==1 {print $2}')"
          test "$actual" = "SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y"
          observed="$(ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$DEPLOY_USER@$HOST" 'id -un')"
          test "$observed" = "$EXPECTED_USER"
          echo "PASS: existing deployment key authenticated; original host fingerprint matched; expected Linux user verified."
