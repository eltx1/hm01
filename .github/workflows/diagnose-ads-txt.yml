name: Diagnose ads.txt fetching
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-ads-txt.yml]
  workflow_dispatch:
  workflow_run:
    workflows: [Verify production live]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Read-only aggregate ads.txt diagnosis
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
          REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          php_file="$(mktemp)"
          cat > "$php_file" <<'PHP'
          <?php
          chdir($argv[1]);
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $counts = [];
          $checks = App\Models\SupplyChainCheck::withoutGlobalScopes()->where('check_type', 'ADS_TXT')->orderByDesc('checked_at')->limit(1000)->get()->unique('site_id');
          foreach ($checks as $check) {
              $code = data_get($check->findings, 'fetch.error_code') ?: $check->status;
              $counts[$code] = ($counts[$code] ?? 0) + 1;
          }
          echo json_encode(['latest_fetch_codes' => $counts, 'curl' => extension_loaded('curl'), 'allow_url_fopen' => ini_get('allow_url_fopen')], JSON_THROW_ON_ERROR).PHP_EOL;
          $live = [];
          foreach (App\Models\Site::withoutGlobalScopes()->where('status', 'ACTIVE')->limit(3)->get() as $site) {
              $result = app(App\Services\Compliance\AdsTxtFetcher::class)->fetch($site);
              $code = $result['error_code'] ?: 'FETCH_OK';
              $gate = app(App\Services\TrafficGate\TrafficGateConfigurationResolver::class)->resolve($site);
              $live[] = ['code' => $code, 'http_status' => $result['http_status'], 'duration_ms' => $result['duration_ms'], 'redirect_hops' => count($result['redirects']), 'traffic_gate_enabled' => $gate->enabled, 'traffic_gate_max_wait_ms' => $gate->maxWaitMs];
          }
          echo json_encode(['active_site_live_fetches' => $live], JSON_THROW_ON_ERROR).PHP_EOL;
          PHP
          encoded="$(base64 -w0 "$php_file")"
          ssh -p "$SSH_PORT" "$USER@$HOST" "tmp_file=\$(mktemp); printf '%s' '$encoded' | base64 -d > \"\$tmp_file\"; php \"\$tmp_file\" '$REMOTE_HOME/htdocs/app.horusmedia.net'; result=\$?; rm -f \"\$tmp_file\"; exit \$result"
      - name: Read Cloudflare Workers aggregate metrics without configuration writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountTag) {
            console.log('WORKERS_ANALYTICS=CONFIG_NOT_AVAILABLE');
            process.exit(0);
          }
          const end = new Date();
          const start = new Date(end.getTime() - 24 * 60 * 60 * 1000);
          const query = `query ($accountTag: string, $start: string, $end: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 100, filter: {datetime_geq: $start, datetime_leq: $end}) {
                dimensions { scriptName status }
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 }
              }
            } }
          }`;
          try {
            const response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
              body: JSON.stringify({query, variables: {accountTag, start: start.toISOString(), end: end.toISOString()}}),
              signal: AbortSignal.timeout(15000),
            });
            const result = await response.json();
            if (!response.ok || result.errors?.length) {
              console.log(JSON.stringify({workersAnalytics: 'UNAVAILABLE', httpStatus: response.status, errorCount: result.errors?.length || 0}));
            } else {
              console.log(JSON.stringify({workersAnalytics: 'READ', from: start.toISOString(), to: end.toISOString(), metrics: result.data?.viewer?.accounts?.flatMap(a => a.workersInvocationsAdaptive) || []}));
            }
          } catch { console.log('WORKERS_ANALYTICS=REQUEST_FAILED'); }
          JS
