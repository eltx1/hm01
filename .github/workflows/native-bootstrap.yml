name: Native demand bootstrap

on:
  push:
    branches:
      - agent/native-alternative-demand-networks
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Materialize validated runtime files
        shell: bash
        run: |
          set -euo pipefail
          materialize() {
            local source="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            base64 --decode "$source" | gzip --decompress > "$target"
          }

          materialize .native-bootstrap/AbstractDemandConnector.php.gz.b64 app/Services/Demand/AbstractDemandConnector.php
          materialize .native-bootstrap/DemandAccountService.php.gz.b64 app/Services/Demand/DemandAccountService.php
          materialize .native-bootstrap/DemandGamDeploymentService.php.gz.b64 app/Services/Demand/DemandGamDeploymentService.php
          materialize .native-bootstrap/DemandNetworkController.php.gz.b64 app/Http/Controllers/Admin/DemandNetworkController.php
          materialize .native-bootstrap/hm-loader.js.gz.b64 public/assets/hm-loader.js
          materialize .native-bootstrap/hm-loader.min.js.gz.b64 public/assets/hm-loader.min.js

          php -l app/Services/Demand/AbstractDemandConnector.php
          php -l app/Services/Demand/DemandAccountService.php
          php -l app/Services/Demand/DemandGamDeploymentService.php
          php -l app/Http/Controllers/Admin/DemandNetworkController.php
          node --check public/assets/hm-loader.js
          node --check public/assets/hm-loader.min.js
          node --test tests/Browser/hm-loader-native.test.js

          rm -rf .native-bootstrap

      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize native demand runtime"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
