name: One-shot clean AYIN SMTP bridge ciphertext

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-check-ayin-smtp-bridge.yml

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
    steps:
      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove Horus-owned temporary ciphertext
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(hostname)" == "ip-172-31-4-110" ]]
          rm -f /tmp/ayin-smtp-bridge.key.enc /tmp/ayin-smtp-bridge.payload.enc
          test ! -e /tmp/ayin-smtp-bridge.key.enc
          test ! -e /tmp/ayin-smtp-bridge.payload.enc
          echo "AYIN_SMTP_BRIDGE_CIPHERTEXT_CLEANED=YES"
          REMOTE
