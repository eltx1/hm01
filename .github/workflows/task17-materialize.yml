name: Task 17 Direct Demand Materialize

on:
  push:
    branches:
      - task-17-universal-direct-js-demand-engine

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-17-universal-direct-js-demand-engine
          fetch-depth: 0
      - name: Materialize and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/task17_materialize.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/assets/hm-loader.js')
          text = p.read_text()
          text = text.replace(
              "timeoutMs: Math.max(500, Math.min(10000, Number(render.timeoutMs || tag.renderTimeoutMs || 2500))),",
              "timeoutMs: Math.max(0, Math.min(10000, Number(render.timeoutMs || tag.renderTimeoutMs || 2500))),"
          )
          text = text.replace(
              "}, Math.max(500, Math.min(10000, Number((candidate.tag && directRenderPolicy(candidate.tag).timeoutMs) || 2500))));",
              "}, Math.max(100, Math.min(10000, Number((candidate.tag && directRenderPolicy(candidate.tag).timeoutMs) || 2500))));"
          )
          old = """        iframe.srcdoc = '<!doctype html><html><head><meta http-equiv=\"Content-Security-Policy\" content=\"' + safeCsp + '\"></head><body>' + String(isolation.html) + '</body></html>';
        if (entry.element.appendChild) entry.element.appendChild(iframe);
        return new Promise(function (resolve) {
            var settled = false;
            var timeout = directRenderPolicy(tag).timeoutMs;
            var timer = window.setTimeout(function () { if (!settled) { settled = true; resolve(false); } }, timeout);
            iframe.onload = function () {
                if (settled || !canRequestAds(config)) return;
                settled = true; window.clearTimeout(timer); resolve(true);
            };
            iframe.onerror = function () { if (!settled) { settled = true; window.clearTimeout(timer); resolve(false); } };
        });
"""
          new = """        iframe.srcdoc = '<!doctype html><html><head><meta http-equiv=\"Content-Security-Policy\" content=\"' + safeCsp + '\"></head><body>' + String(isolation.html) + '</body></html>';
        return new Promise(function (resolve) {
            var settled = false;
            var timeout = directRenderPolicy(tag).timeoutMs;
            var timer = window.setTimeout(function () { if (!settled) { settled = true; resolve(false); } }, timeout);
            iframe.onload = function () {
                if (settled || !canRequestAds(config)) return;
                settled = true; window.clearTimeout(timer); resolve(true);
            };
            iframe.onerror = function () { if (!settled) { settled = true; window.clearTimeout(timer); resolve(false); } };
            if (entry.element.appendChild) entry.element.appendChild(iframe);
        });
"""
          if old not in text:
              raise SystemExit('isolated iframe marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          php -l app/Services/Demand/AbstractDemandConnector.php
          php -l app/Services/Demand/DemandConfigurationBuilder.php
          php -l app/Services/Demand/DirectTagRecipeParser.php
          php -l app/Services/Demand/MgidConnector.php
          php -l app/Services/Demand/OutbrainConnector.php
          php -l app/Services/Demand/TaboolaConnector.php
          php -l app/Services/Inventory/SiteConfigurationBuilder.php
          node --check public/assets/hm-loader.js
          rm scripts/task17_materialize.py
          rm .github/workflows/task17-materialize.yml
      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 17: materialize universal Direct Demand runtime"
          git push origin HEAD:task-17-universal-direct-js-demand-engine
