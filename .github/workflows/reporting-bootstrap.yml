name: Materialize reporting and finance system

on:
  push:
    branches:
      - agent/reporting-finance-payments
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reporting branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/reporting-finance-payments

      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .reporting-bootstrap/chunk-* > /tmp/reporting-system.tar.gz
          gzip -t /tmp/reporting-system.tar.gz
          tar -xzf /tmp/reporting-system.tar.gz
          python3 .reporting-bootstrap/apply_existing.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/Services/Reporting/UnifiedReportService.php')
          text = path.read_text()
          replacements = {
              "            ->whereBetween('effective_on', [$from->toDateString(), $to->toDateString()])": "            ->whereDate('effective_on', '>=', $from->toDateString())\n            ->whereDate('effective_on', '<=', $to->toDateString())",
              "            ->whereBetween('report_date', [$from->toDateString(), $to->toDateString()])": "            ->whereDate('report_date', '>=', $from->toDateString())\n            ->whereDate('report_date', '<=', $to->toDateString())",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Expected reporting date filter not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -rf .reporting-bootstrap
          rm -f .github/workflows/reporting-bootstrap.yml

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, soap, openssl
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app config database bootstrap routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Validate migrations, seeders, routes, and focused tests
        shell: bash
        run: |
          set -euo pipefail
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite"
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan route:list --path=reporting
          php artisan test tests/Unit/RevenueCalculationTest.php tests/Feature/ReportingFinancialSystemTest.php tests/Feature/DirectCampaignSystemTest.php tests/Feature/DemandNetworkSystemTest.php

      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement unified reporting and financial operations"
          git push origin HEAD:agent/reporting-finance-payments
