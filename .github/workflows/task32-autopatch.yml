name: Task 32 Patch

on:
  push:
    branches: [task-32-supply-chain-standards-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-32-supply-chain-standards-contract
          fetch-depth: 0
      - run: python3 .github/task32_patch.py
      - name: Commit Task 32 patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Task 32 branch already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/StaticDeliveryTest.php tests/Feature/SupplyChainIdentityTest.php tests/Feature/SupplyChainStandardsContractTest.php app/Services/Inventory/SiteConfigurationBuilder.php app/Services/SupplyChain/PublicExtensionGuard.php
          git commit -m "Task 32: close runtime and legacy regression gaps"
          git push origin HEAD:task-32-supply-chain-standards-contract
