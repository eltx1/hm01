name: Deploy Turnstile Siteverify Worker
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Provision Worker, secret binding and custom domain
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - workers/siteverify/**
      - scripts/deploy-siteverify.mjs
      - .github/workflows/deploy-siteverify.yml
permissions:
  contents: read
concurrency:
  group: production-siteverify
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/Browser/siteverify-worker.test.js
      - name: Test native Workers runtime before deployment
        run: |
          npm ci --prefix tests/Workers --no-audit --no-fund
          npm test --prefix tests/Workers
      - name: Verify account readiness without writes
        run: node scripts/deploy-siteverify.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and verify bindings
        if: github.event_name == 'push' || inputs.apply == true
        run: node scripts/deploy-siteverify.mjs --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
