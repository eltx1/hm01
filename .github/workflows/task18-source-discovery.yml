name: Task18 Source Discovery

'on':
  push:
    branches:
      - task-18-direct-demand-admin-control-center

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-18-direct-demand-admin-control-center
      - run: |
          grep -R "admin.demand.index\|admin.sites.demand.index\|demand.view\|demand.manage" -n app bootstrap config database routes tests resources --exclude='*.map' | head -200
