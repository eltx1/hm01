name: Task19 Targeted

on:
  push:
    branches:
      - task-19-unified-multi-engine-serving-control-center

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-19-unified-multi-engine-serving-control-center
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, soap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - name: Materialize Task 19 browser regression
        run: python3 tools/task19_test_materialize.py
      - name: PHP lint
        run: |
          php -l app/Models/MonetizationHealthState.php
          php -l app/Services/Monetization/ReportingHealthService.php
          php -l app/Services/Monetization/SiteServingOverviewService.php
          php -l app/Services/Monetization/MonetizationHealthMonitor.php
          php -l app/Services/ControlPlane/Actions/MonetizationActions.php
          php -l tests/Feature/UnifiedMultiEngineServingControlCenterTest.php
          php -l database/migrations/2026_08_13_001900_create_monetization_health_states_table.php
      - name: Targeted backend matrix
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/UnifiedMultiEngineServingControlCenterTest.php tests/Feature/GamOptionalServingModelTest.php tests/Feature/PrebidModeControlHardeningTest.php tests/Feature/DirectDemandAdminControlCenterTest.php tests/Feature/PublisherMonetizationHealthTest.php tests/Feature/NotificationCenterTest.php tests/Feature/ControlPlaneFoundationTest.php
      - name: Browser engine regressions
        run: |
          node --test tests/Browser/hm-loader-prebid-standalone.test.js tests/Browser/hm-loader-direct-demand.test.js tests/Browser/hm-loader-prebid-mode-hardening.test.js tests/Browser/hm-loader-native.test.js
      - name: Commit validated browser regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/task19_test_materialize.py .github/workflows/task19-targeted.yml
          git add tests/Browser/hm-loader-prebid-standalone.test.js
          git commit -m "Task 19: validate parallel Prebid and Direct JS serving"
          git push origin HEAD:task-19-unified-multi-engine-serving-control-center
