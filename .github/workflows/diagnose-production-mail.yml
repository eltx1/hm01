name: Diagnose production mail

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-production-mail.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
    steps:
      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run safe SMTP diagnostic
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          diagnostic_file="$(mktemp)"
          cat > "$diagnostic_file" <<'PHP'
          <?php
          $appPath = $argv[1];
          chdir($appPath);
          require $appPath.'/vendor/autoload.php';
          $app = require $appPath.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          try {
              $email = App\Models\User::query()->orderBy('id')->value('email');
              if (! is_string($email) || $email === '') {
                  echo 'MAIL_DIAGNOSTIC_RESULT=NO_TEST_USER'.PHP_EOL;
                  exit(1);
              }

              $result = app('auth.password.broker')->sendResetLink(['email' => $email]);

              echo 'MAIL_DIAGNOSTIC_RESULT='.match ($result) {
                  'passwords.sent' => 'SENT',
                  'passwords.user' => 'USER_NOT_FOUND',
                  'passwords.throttled' => 'THROTTLED',
                  default => 'UNEXPECTED_STATUS',
              }.PHP_EOL;
          } catch (Throwable $exception) {
              $message = strtolower($exception->getMessage());
              $category = match (true) {
                  str_contains($message, 'unsupported mail transport') => 'MAILER_INVALID',
                  str_contains($message, 'authentication failed'),
                  str_contains($message, 'username and password not accepted'),
                  str_contains($message, 'application-specific password'),
                  str_contains($message, 'bad credentials'),
                  str_contains($message, '534'),
                  str_contains($message, '535') => 'SMTP_AUTH_FAILED',
                  str_contains($message, 'must issue a starttls'),
                  str_contains($message, '530 5.7.0') => 'SMTP_STARTTLS_REQUIRED',
                  str_contains($message, 'connection could not be established'),
                  str_contains($message, 'connection refused'),
                  str_contains($message, 'timed out'),
                  str_contains($message, 'empty response') => 'SMTP_CONNECTION_FAILED',
                  str_contains($message, 'certificate'),
                  str_contains($message, 'crypto') => 'SMTP_TLS_FAILED',
                  str_contains($message, '421'),
                  str_contains($message, '450'),
                  str_contains($message, '451'),
                  str_contains($message, '452'),
                  str_contains($message, 'rate limit') => 'SMTP_TEMPORARY_LIMIT',
                  preg_match('/got code "?(\\d{3})/', $message, $matches) === 1 => 'SMTP_CODE_'.$matches[1],
                  default => 'OTHER_'.strtoupper((new ReflectionClass($exception))->getShortName()),
              };

              echo 'MAIL_DIAGNOSTIC_RESULT='.$category.PHP_EOL;
              exit(1);
          }
          PHP

          encoded="$(base64 -w0 "$diagnostic_file")"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "tmp_file=\$(mktemp); printf '%s' '$encoded' | base64 -d > \"\$tmp_file\"; php \"\$tmp_file\" '$REMOTE_HOME/htdocs/app.horusmedia.net'; status=\$?; rm -f \"\$tmp_file\"; exit \$status"
