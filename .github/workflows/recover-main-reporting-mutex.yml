name: Recover abandoned main reporting lease
on:
  pull_request:
    paths:
      - '.github/workflows/recover-main-reporting-mutex.yml'
      - 'ops/audit/recover-main-reporting-mutex.php'
      - 'ops/audit/validate-main-reporting-recovery.mjs'
      - 'tests/Deployment/main-reporting-mutex-recovery.test.mjs'
      - 'tests/Deployment/main-reporting-mutex-recovery-workflow.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-main-reporting-mutex.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: horus-main-legacy-lease-recovery
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate exact legacy lease recovery and disclosure contract
        run: |
          php -l ops/audit/recover-main-reporting-mutex.php
          node --test tests/Deployment/main-reporting-mutex-recovery.test.mjs tests/Deployment/main-reporting-mutex-recovery-workflow.test.mjs
  recover:
    if: github.event_name == 'push' && github.repository == 'eltx1/hm01' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve latest trusted successful live verification
        id: live_source
        uses: actions/github-script@v8
        with:
          script: |
            // BEGIN_PROOF_TOOLS
            function proofTools() {
              const repository = 'eltx1/hm01';
              const repositoryId = 1315038901;
              const kinds = {
                verify: {name:'Verify production live',path:'.github/workflows/verify-production-live.yml',events:['workflow_run','workflow_dispatch']},
                deploy: {name:'Deploy production',path:'.github/workflows/deploy-production.yml',events:['workflow_run','workflow_dispatch']},
                validation: {name:'Production release validation',path:'.github/workflows/production-release.yml',events:['push']},
              };
              const demand = value => { if (!value) throw new Error('UNTRUSTED_PROOF'); };
              const id = value => /^[1-9][0-9]*$/.test(String(value)) && Number.isSafeInteger(Number(value));
              const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
              const digest = value => typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
              const time = value => typeof value === 'string' && Number.isFinite(Date.parse(value));
              function contextOk(context) {
                demand(context.eventName==='push' && context.ref==='refs/heads/main'
                  && `${context.repo.owner}/${context.repo.repo}`===repository
                  && context.payload.repository?.full_name===repository && context.payload.repository.id===repositoryId);
              }
              function workflowOk(workflow,kind) {
                const expected=kinds[kind];
                demand(expected && id(workflow.id) && workflow.name===expected.name && workflow.path===expected.path && workflow.state==='active');
              }
              function runOk(run,runId,kind,workflowId,releaseSha=null) {
                const expected=kinds[kind];
                demand(expected && id(runId) && Number(run.id)===Number(runId) && id(run.run_attempt)
                  && Number(run.workflow_id)===Number(workflowId) && run.name===expected.name && run.path===expected.path
                  && expected.events.includes(run.event) && run.status==='completed' && run.conclusion==='success'
                  && run.head_branch==='main' && sha(run.head_sha) && (!releaseSha || run.head_sha===releaseSha)
                  && run.repository?.full_name===repository && run.head_repository?.full_name===repository
                  && run.repository.id===repositoryId && run.head_repository.id===repositoryId
                  && time(run.run_started_at) && time(run.updated_at) && Date.parse(run.updated_at)>=Date.parse(run.run_started_at));
              }
              function artifactOk(artifact,run,name,maxBytes=65536) {
                demand(id(artifact.id) && artifact.name===name && artifact.expired===false
                  && Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes>0 && artifact.size_in_bytes<=maxBytes
                  && /^sha256:[a-f0-9]{64}$/.test(artifact.digest)
                  && Number(artifact.workflow_run?.id)===Number(run.id) && artifact.workflow_run.head_sha===run.head_sha
                  && artifact.workflow_run.head_branch==='main' && artifact.workflow_run.repository_id===repositoryId
                  && artifact.workflow_run.head_repository_id===repositoryId && time(artifact.created_at)
                  && Date.parse(artifact.created_at)>=Date.parse(run.run_started_at) && Date.parse(artifact.created_at)<=Date.parse(run.updated_at));
              }
              function parseProof(text) {
                demand(typeof text==='string' && text.length>0 && text.length<=16384);
                const proof=Object.create(null);
                for (const line of text.replace(/\n$/,'').split('\n')) {
                  const match=/^([a-z][a-z0-9_]*)=([^\r\n]*)$/.exec(line);
                  demand(match && !Object.hasOwn(proof,match[1])); proof[match[1]]=match[2];
                }
                demand(proof.schema_version==='1' && sha(proof.release_sha));
                return proof;
              }
              function liveOk(proof,run) {
                demand(Object.keys(proof).sort().join(',')===['schema_version','release_sha','deploy_run_id','manifest_hash','pages_deployment_url','lordai_config_path','lordai_config_sha256','lordai_loader_sha256','verify_run_id','verify_run_attempt'].sort().join(','));
                demand(proof.verify_run_id===String(run.id) && proof.verify_run_attempt===String(run.run_attempt)
                  && id(proof.deploy_run_id) && digest(proof.manifest_hash)
                  && digest(proof.lordai_config_sha256) && digest(proof.lordai_loader_sha256));
              }
              function deployOk(proof,run,releaseSha) {
                demand(Object.keys(proof).sort().join(',')===['schema_version','release_sha','validation_run_id','artifact_sha256','deploy_run_id','deploy_run_attempt'].sort().join(','));
                demand(proof.release_sha===releaseSha && proof.deploy_run_id===String(run.id)
                  && proof.deploy_run_attempt===String(run.run_attempt) && id(proof.validation_run_id) && digest(proof.artifact_sha256));
              }
              return {demand,id,sha,kinds,contextOk,workflowOk,runOk,artifactOk,parseProof,liveOk,deployOk};
            }
            // END_PROOF_TOOLS
            const fs=require('fs'); const path=require('path'); const trust=proofTools();
            try {
              trust.contextOk(context);
              const common={owner:context.repo.owner,repo:context.repo.repo};
              const workflows={};
              for(const [kind,expected] of Object.entries(trust.kinds)) {
                const {data:workflow}=await github.rest.actions.getWorkflow({...common,workflow_id:path.basename(expected.path)});
                trust.workflowOk(workflow,kind); workflows[kind]=workflow.id;
              }
              // Choose the newest success once. Never fall back to an older proof on rejection.
              const {data:listing}=await github.rest.actions.listWorkflowRuns({...common,workflow_id:workflows.verify,branch:'main',status:'success',per_page:1});
              trust.demand(Array.isArray(listing.workflow_runs) && listing.workflow_runs.length===1);
              const runId=listing.workflow_runs[0].id;
              const {data:run}=await github.rest.actions.getWorkflowRun({...common,run_id:runId});
              trust.runOk(run,runId,'verify',workflows.verify);
              const {data:attempt}=await github.rest.actions.getWorkflowRunAttempt({...common,run_id:run.id,attempt_number:run.run_attempt});
              trust.runOk(attempt,run.id,'verify',workflows.verify,run.head_sha);
              trust.demand(attempt.run_attempt===run.run_attempt);
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...common,run_id:run.id,per_page:100});
              const matches=artifacts.filter(item=>item.name==='horus-production-live-proof');
              trust.demand(matches.length===1); trust.artifactOk(matches[0],attempt,'horus-production-live-proof');
              const directory=path.join(process.env.RUNNER_TEMP,'main-lease-trust');
              fs.mkdirSync(directory,{recursive:true,mode:0o700});
              fs.writeFileSync(path.join(directory,'tools.cjs'),`module.exports=(${proofTools.toString()})();`,{mode:0o600});
              fs.writeFileSync(path.join(directory,'metadata.json'),JSON.stringify({workflows,verify:attempt,liveArtifact:matches[0]}),{mode:0o600});
              core.setOutput('run_id',String(run.id)); core.setOutput('artifact_id',String(matches[0].id));
            } catch { core.setFailed('MAIN_LEASE_TRUST_PROOF_INVALID'); }

      - name: Download exact immutable live proof
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.live_source.outputs.artifact_id }}
          path: ${{ runner.temp }}/main-lease-trust/live
          run-id: ${{ steps.live_source.outputs.run_id }}
          repository: eltx1/hm01
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true

      - name: Validate live proof and its trusted deployment source
        id: deploy_source
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'); const path=require('path');
            try {
              const directory=path.join(process.env.RUNNER_TEMP,'main-lease-trust');
              const trust=require(path.join(directory,'tools.cjs')); trust.contextOk(context);
              const metadata=JSON.parse(fs.readFileSync(path.join(directory,'metadata.json'),'utf8'));
              const file=path.join(directory,'live','live-proof.env'); const stat=fs.lstatSync(file);
              trust.demand(stat.isFile() && !stat.isSymbolicLink() && stat.size<=16384);
              const live=trust.parseProof(fs.readFileSync(file,'utf8')); trust.liveOk(live,metadata.verify);
              const common={owner:context.repo.owner,repo:context.repo.repo};
              const {data:run}=await github.rest.actions.getWorkflowRun({...common,run_id:Number(live.deploy_run_id)});
              trust.runOk(run,live.deploy_run_id,'deploy',metadata.workflows.deploy);
              const {data:attempt}=await github.rest.actions.getWorkflowRunAttempt({...common,run_id:run.id,attempt_number:run.run_attempt});
              trust.runOk(attempt,run.id,'deploy',metadata.workflows.deploy,run.head_sha);
              trust.demand(attempt.run_attempt===run.run_attempt);
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...common,run_id:run.id,per_page:100});
              const matches=artifacts.filter(item=>item.name==='horus-production-deploy-proof');
              trust.demand(matches.length===1); trust.artifactOk(matches[0],attempt,'horus-production-deploy-proof');
              Object.assign(metadata,{releaseSha:live.release_sha,deploy:attempt,deployArtifact:matches[0]});
              fs.writeFileSync(path.join(directory,'metadata.json'),JSON.stringify(metadata),{mode:0o600});
              core.setOutput('run_id',String(run.id)); core.setOutput('artifact_id',String(matches[0].id));
            } catch { core.setFailed('MAIN_LEASE_TRUST_PROOF_INVALID'); }

      - name: Download exact immutable deployment proof
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.deploy_source.outputs.artifact_id }}
          path: ${{ runner.temp }}/main-lease-trust/deploy
          run-id: ${{ steps.deploy_source.outputs.run_id }}
          repository: eltx1/hm01
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true

      - name: Verify complete proof chain and pin current expected release
        id: release_proof
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'); const path=require('path');
            try {
              const directory=path.join(process.env.RUNNER_TEMP,'main-lease-trust');
              const trust=require(path.join(directory,'tools.cjs')); trust.contextOk(context);
              const metadata=JSON.parse(fs.readFileSync(path.join(directory,'metadata.json'),'utf8'));
              const file=path.join(directory,'deploy','deploy-proof.env'); const stat=fs.lstatSync(file);
              trust.demand(stat.isFile() && !stat.isSymbolicLink() && stat.size<=16384);
              const deployed=trust.parseProof(fs.readFileSync(file,'utf8'));
              trust.deployOk(deployed,metadata.deploy,metadata.releaseSha);
              const common={owner:context.repo.owner,repo:context.repo.repo};
              const {data:validation}=await github.rest.actions.getWorkflowRun({...common,run_id:Number(deployed.validation_run_id)});
              trust.runOk(validation,deployed.validation_run_id,'validation',metadata.workflows.validation,metadata.releaseSha);
              const {data:attempt}=await github.rest.actions.getWorkflowRunAttempt({...common,run_id:validation.id,attempt_number:validation.run_attempt});
              trust.runOk(attempt,validation.id,'validation',metadata.workflows.validation,metadata.releaseSha);
              trust.demand(attempt.run_attempt===validation.run_attempt);
              // Producer workflow heads may differ from the deployed release. Only the
              // linked successful PUSH validation must have the exact release SHA.
              // Recheck each producer's own head/attempt and artifact provenance.
              for(const [kind,run] of [['verify',metadata.verify],['deploy',metadata.deploy],['validation',attempt]]) {
                const {data:current}=await github.rest.actions.getWorkflowRun({...common,run_id:run.id});
                trust.runOk(current,run.id,kind,metadata.workflows[kind],run.head_sha);
                trust.demand(current.run_attempt===run.run_attempt);
              }
              for(const [name,artifact,run] of [['horus-production-live-proof',metadata.liveArtifact,metadata.verify],['horus-production-deploy-proof',metadata.deployArtifact,metadata.deploy]]) {
                const {data:current}=await github.rest.actions.getArtifact({...common,artifact_id:artifact.id});
                trust.artifactOk(current,run,name); trust.demand(current.digest===artifact.digest);
              }
              // Never substitute branch HEAD. SSH also checks this exact pin on every call.
              core.setOutput('release_sha',metadata.releaseSha);
            } catch { core.setFailed('MAIN_LEASE_TRUST_PROOF_INVALID'); }

      - name: Recover only a proven abandoned legacy main scheduler lease
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.release_proof.outputs.release_sha }}
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" =~ ^/[A-Za-z0-9/_-]+$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          work="$RUNNER_TEMP/main-lease-recovery"
          install -d -m 700 "$work"
          printf '%s\n' "$SSH_KEY" > "$work/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/id_ed25519" "$work/known_hosts"
          trap 'rm -f "$work/id_ed25519" "$work/known_hosts" "$work/result.json" "$work/error.txt" "$work/remote-run.sh"' EXIT
          unset SSH_KEY KNOWN_HOSTS
          cat > "$work/remote-run.sh" <<'REMOTE'
          set +x
          set -euo pipefail
          umask 077
          expected="$1"; app="$2"; mode="$3"
          [[ "$expected" =~ ^[a-f0-9]{40}$ ]]
          [[ "$app" =~ ^/[A-Za-z0-9/_.-]+$ ]]
          [[ "$mode" == preview || "$mode" == apply ]]
          cd "$app"
          test -x /usr/bin/timeout
          evidence_dir="$(mktemp -d /tmp/horus-main-lease.XXXXXXXXXX)"
          watcher=''
          trap 'status=$?; if [[ -n "$watcher" ]]; then kill "$watcher" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true; fi; rm -rf "$evidence_dir"; exit "$status"' EXIT
          collect_cron() {
            local cron encoded observed uid
            observed="$(date +%s)"; uid="$(id -u)"
            if cron="$(crontab -l 2>/dev/null)" && (( ${#cron} <= 65536 )); then
              encoded="$(printf '%s' "$cron" | base64 -w 0)"
              printf '{"schema_version":1,"available":true,"observed_at":%s,"uid":%s,"cron_base64":"%s"}\n' "$observed" "$uid" "$encoded" > "$evidence_dir/next"
            else
              printf '{"schema_version":1,"available":false}\n' > "$evidence_dir/next"
            fi
            chmod 600 "$evidence_dir/next"
            mv -f "$evidence_dir/next" "$evidence_dir/cron.json"
          }
          collect_cron
          (while sleep 1; do collect_cron; done) &
          watcher=$!
          HM_EXPECTED_RELEASE_SHA="$expected" HM_RECOVERY_APP_LINK="$app" HM_MAIN_RECOVERY_MODE="$mode" HM_RECOVERY_CRON_EVIDENCE="$evidence_dir/cron.json" /usr/bin/timeout --kill-after=10 240 /usr/bin/php8.4 -d display_errors=0 -d log_errors=0 <<'RECOVERY_PHP'
          REMOTE
          cat ops/audit/recover-main-reporting-mutex.php >> "$work/remote-run.sh"
          printf '\nRECOVERY_PHP\n' >> "$work/remote-run.sh"
          bash -n "$work/remote-run.sh"
          app="$REMOTE_HOME/htdocs/app.horusmedia.net"
          invoke() {
            local mode="$1"
            if ! timeout 280 ssh -F /dev/null -T -i "$work/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UpdateHostKeys=no -o UserKnownHostsFile="$work/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$SSH_PORT" "$USER@$HOST" \
              "/bin/bash -s -- '$EXPECTED_RELEASE_SHA' '$app' '$mode'" \
              < "$work/remote-run.sh" > "$work/result.json" 2> "$work/error.txt"; then
              # A failed remote invocation may still supply a safe closed-stage result.
              node ops/audit/validate-main-reporting-recovery.mjs "$work/result.json" || true
              echo 'Targeted main lease recovery unavailable. Raw output withheld.' >&2
              return 1
            fi
            node ops/audit/validate-main-reporting-recovery.mjs "$work/result.json"
          }
          invoke preview
          status="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(x.status)' "$work/result.json")"
          case "$status" in
            NO_ACTION) exit 0 ;;
            ELIGIBLE) ;;
            *) echo 'Targeted main lease preflight stopped safely.' >&2; exit 1 ;;
          esac
          invoke apply
          status="$(node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(x.status)' "$work/result.json")"
          case "$status" in
            RELEASED|NO_ACTION) exit 0 ;;
            *) echo 'Targeted main lease recovery stopped safely.' >&2; exit 1 ;;
          esac
