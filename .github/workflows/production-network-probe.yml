name: Production SSH network probe

on:
  pull_request:
    paths:
      - .github/workflows/production-network-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify TCP reachability only
        shell: bash
        run: |
          set -euo pipefail
          timeout 15 bash -c 'exec 3<>/dev/tcp/13.52.116.200/22'
      - name: Capture public Ed25519 host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 13.52.116.200 > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts"
          printf '%s\n' 'BEGIN_KNOWN_HOSTS'
          cat "$RUNNER_TEMP/known_hosts"
          printf '%s\n' 'END_KNOWN_HOSTS'
