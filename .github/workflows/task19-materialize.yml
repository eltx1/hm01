name: Task19 Materialize

on:
  push:
    branches:
      - task-19-unified-multi-engine-serving-control-center

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-19-unified-multi-engine-serving-control-center
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply Task 19 materializer
        run: python3 tools/task19_materialize.py
      - name: Lint changed PHP
        run: |
          php -l app/Services/Monetization/SiteMonetizationReadinessService.php
          php -l routes/console.php
      - name: Commit materialized product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/task19_materialize.py .github/workflows/task19-materialize.yml
          git add app/Services/Monetization/SiteMonetizationReadinessService.php resources/views/publisher/sites/show.blade.php routes/console.php
          git commit -m "Task 19: integrate engine-aware readiness and health monitoring"
          git push origin HEAD:task-19-unified-multi-engine-serving-control-center
