name: LordAI Quick Monetize display suite

on:
  workflow_run:
    workflows:
      - Deploy production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lordai-quick-display-suite-v1
  cancel-in-progress: false

jobs:
  rollout:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      SITE_KEY: hm_ircll0wkqg54jvt9gz85mhr2

    steps:
      - name: Validate production connection inputs
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$SITE_KEY" =~ ^hm_[a-z0-9_-]+$ ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create missing compatible LordAI display and edge placements once
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-display-suite-v1.done"
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "REMOTE_HOME='$REMOTE_HOME' APP_ROOT='$app_root' SITE_KEY='$SITE_KEY' MARKER='$marker' bash -s" <<'REMOTE'
          set -euo pipefail
          if test -f "$MARKER"; then
            echo "LordAI Quick display suite v1 already completed: $(cat "$MARKER")"
            exit 0
          fi
          test -f "$APP_ROOT/artisan"
          cd "$APP_ROOT"
          php artisan quick-monetize:clone-display-suite "$SITE_KEY" --from=quick_sticky_bottom --no-interaction
          install -d -m 700 "$(dirname "$MARKER")"
          tmp="${MARKER}.tmp.$$"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) deployment=${GITHUB_RUN_ID:-workflow}" > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$MARKER"
          REMOTE

      - name: Verify production has a compatible Quick expansion
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "cd '$app_root' && php artisan tinker --execute=\"\$s=App\\Models\\Site::withoutGlobalScopes()->where('public_key','$SITE_KEY')->firstOrFail(); \$p=App\\Models\\Placement::withoutGlobalScopes()->where('site_id',\$s->id)->whereNull('deleted_at')->get()->filter(fn(\$x)=>(bool)data_get(\$x->metadata,'quick_monetize_generated',false) && \$x->status===App\\Enums\\PlacementStatus::Active); \$presets=\$p->map(fn(\$x)=>(string)data_get(\$x->metadata,'placement_preset',''))->filter()->unique()->values(); if(!\$presets->contains('sticky_bottom') || !\$presets->contains('sticky_top')){throw new RuntimeException('Bottom/top Quick anchors are not both active.');} if(!\$presets->intersect(['responsive_display','in_article_display','high_impact_display','mobile_display'])->count()){throw new RuntimeException('No compatible display surface was activated.');} echo json_encode(\$presets->all());\""

      - name: Explain static-edge follow-up
        run: echo 'The scheduled production static-edge sync will publish the newly generated production config within five minutes; the post-deploy sync may publish it sooner.'
