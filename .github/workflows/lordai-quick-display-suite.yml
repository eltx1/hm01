name: LordAI Quick Monetize display suite

on:
  workflow_run:
    workflows:
      - Deploy production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lordai-quick-display-suite-v2
  cancel-in-progress: false

jobs:
  rollout:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      SITE_DOMAIN: lordai.net

    steps:
      - name: Validate production connection inputs
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$SITE_DOMAIN" =~ ^[a-z0-9.-]+$ ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create missing compatible LordAI display and edge placements once
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-display-suite-v2.done"
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "REMOTE_HOME='$REMOTE_HOME' APP_ROOT='$app_root' SITE_DOMAIN='$SITE_DOMAIN' MARKER='$marker' bash -s" <<'REMOTE'
          set -euo pipefail
          if test -f "$MARKER"; then
            echo "LordAI Quick display suite v2 already completed: $(cat "$MARKER")"
            exit 0
          fi
          test -f "$APP_ROOT/artisan"
          cd "$APP_ROOT"

          site_key="$(php artisan tinker --execute="\$domain=strtolower('$SITE_DOMAIN'); \$sites=App\\Models\\Site::withoutGlobalScopes()->whereNull('deleted_at')->get()->filter(fn(\$site)=>strtolower(preg_replace('/^www\\./i','',(string)\$site->primary_domain))===\$domain)->values(); if(\$sites->count()!==1){throw new RuntimeException('Expected exactly one live site for domain '.$domain.', found '.\$sites->count().'.');} echo 'HORUS_SITE_KEY='.\$sites->first()->public_key.PHP_EOL;" | grep -oE 'HORUS_SITE_KEY=hm_[a-z0-9_-]+' | tail -n 1 | cut -d= -f2)"
          [[ "$site_key" =~ ^hm_[a-z0-9_-]+$ ]]
          echo "Resolved $SITE_DOMAIN to current production site key $site_key."

          php artisan quick-monetize:clone-display-suite "$site_key" --from=quick_sticky_bottom --no-interaction
          install -d -m 700 "$(dirname "$MARKER")"
          tmp="${MARKER}.tmp.$$"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) site=$SITE_DOMAIN key=$site_key deployment=${GITHUB_RUN_ID:-workflow}" > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$MARKER"
          REMOTE

      - name: Verify production has a compatible Quick expansion
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "cd '$app_root' && php artisan tinker --execute=\"\$domain=strtolower('$SITE_DOMAIN'); \$sites=App\\Models\\Site::withoutGlobalScopes()->whereNull('deleted_at')->get()->filter(fn(\$site)=>strtolower(preg_replace('/^www\\./i','',(string)\$site->primary_domain))===\$domain)->values(); if(\$sites->count()!==1){throw new RuntimeException('Expected exactly one live LordAI site.');} \$s=\$sites->first(); \$p=App\\Models\\Placement::withoutGlobalScopes()->where('site_id',\$s->id)->whereNull('deleted_at')->get()->filter(fn(\$x)=>(bool)data_get(\$x->metadata,'quick_monetize_generated',false) && \$x->status===App\\Enums\\PlacementStatus::Active); \$presets=\$p->map(fn(\$x)=>(string)data_get(\$x->metadata,'placement_preset',''))->filter()->unique()->values(); if(!\$presets->contains('sticky_bottom') || !\$presets->contains('sticky_top')){throw new RuntimeException('Bottom/top Quick anchors are not both active.');} if(!\$presets->intersect(['responsive_display','in_article_display','high_impact_display','mobile_display'])->count()){throw new RuntimeException('No compatible display surface was activated.');} echo json_encode(['site_key'=>\$s->public_key,'presets'=>\$presets->all()]);\""

      - name: Explain immediate static-edge follow-up
        run: echo 'A successful rollout automatically triggers the production static-edge sync, which must publish and verify the new LordAI production config before control-plane confirmation.'
