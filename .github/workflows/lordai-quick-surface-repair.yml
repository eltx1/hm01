name: LordAI Quick surface repair

on:
  workflow_run:
    workflows:
      - Deploy production
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the production reconciliation without mutating data or dispatching static-edge sync
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: lordai-quick-surface-repair-v1
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      SITE_DOMAIN: lordai.net

    steps:
      - name: Validate production connection inputs
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$SITE_DOMAIN" =~ ^[a-z0-9.-]+$ ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preview LordAI Quick surface reconciliation
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "APP_ROOT='$app_root' SITE_DOMAIN='$SITE_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f "$APP_ROOT/artisan"
          cd "$APP_ROOT"
          php artisan tinker --execute='
          $domain = strtolower((string) getenv("SITE_DOMAIN"));
          $sites = App\Models\Site::withoutGlobalScopes()
              ->whereNull("deleted_at")
              ->get()
              ->filter(fn ($site) => strtolower(preg_replace("/^www\\./i", "", (string) $site->primary_domain)) === $domain)
              ->values();
          if ($sites->count() !== 1) {
              throw new RuntimeException("Expected exactly one live site for domain ".$domain.", found ".$sites->count().".");
          }
          $site = $sites->first();
          $keepPresets = collect(["sticky_bottom", "sticky_top"]);
          $rolloutCodes = collect([
              "quick_responsive_display",
              "quick_in_article_display",
              "quick_high_impact_display",
              "quick_mobile_display",
          ]);
          $quickPlacements = App\Models\Placement::withoutGlobalScopes()
              ->withTrashed()
              ->where("site_id", $site->id)
              ->get()
              ->filter(fn ($placement) => (bool) data_get($placement->metadata, "quick_monetize_generated", false))
              ->values();

          $keepers = collect();
          foreach ($keepPresets as $preset) {
              $canonicalCode = "quick_".$preset;
              $active = $quickPlacements
                  ->filter(fn ($placement) => ! $placement->trashed()
                      && (string) data_get($placement->metadata, "placement_preset", "") === $preset
                      && $placement->status === App\Enums\PlacementStatus::Active)
                  ->sortByDesc(fn ($placement) => sprintf(
                      "%d-%s-%s",
                      (string) $placement->code === $canonicalCode ? 1 : 0,
                      optional($placement->created_at)->format("YmdHis.u") ?: "0",
                      $placement->id
                  ))
                  ->values();
              if ($active->isEmpty()) {
                  throw new RuntimeException("No active Quick Monetize surface exists for required preset ".$preset.".");
              }
              $keepers->put($preset, $active->first());
          }

          $plannedDisabled = $quickPlacements
              ->filter(function ($placement) use ($keepers, $keepPresets, $rolloutCodes): bool {
                  if ($placement->trashed()) return false;
                  $preset = (string) data_get($placement->metadata, "placement_preset", "");
                  $keeper = $keepers->get($preset);
                  $duplicateAnchor = $keepPresets->contains($preset) && (! $keeper || $keeper->id !== $placement->id);
                  $rolloutDisplay = $rolloutCodes->contains((string) $placement->code);
                  return $duplicateAnchor || $rolloutDisplay;
              })
              ->map(function ($placement) use ($keepers, $keepPresets): array {
                  $preset = (string) data_get($placement->metadata, "placement_preset", "");
                  $keeper = $keepers->get($preset);
                  $duplicateAnchor = $keepPresets->contains($preset) && (! $keeper || $keeper->id !== $placement->id);
                  return [
                      "code" => $placement->code,
                      "preset" => $preset,
                      "reason" => $duplicateAnchor ? "duplicate_anchor" : "removed_display_suite_rollout",
                  ];
              })
              ->values();
          $preserved = $quickPlacements
              ->filter(fn ($placement) => ! $placement->trashed() && $placement->status === App\Enums\PlacementStatus::Active)
              ->reject(fn ($placement) => $plannedDisabled->contains(fn ($planned) => $planned["code"] === $placement->code))
              ->map(fn ($placement) => ["code" => $placement->code, "preset" => data_get($placement->metadata, "placement_preset")])
              ->values();

          echo json_encode([
              "dry_run" => true,
              "site_key" => $site->public_key,
              "kept_anchors" => $keepers->map(fn ($placement) => ["code" => $placement->code, "preset" => data_get($placement->metadata, "placement_preset")])->values()->all(),
              "would_disable" => $plannedDisabled->all(),
              "would_preserve" => $preserved->all(),
              "would_publish_production_config" => true,
              "would_dispatch_static_edge_sync" => true,
          ], JSON_THROW_ON_ERROR).PHP_EOL;
          '
          REMOTE

  repair:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      SITE_DOMAIN: lordai.net

    steps:
      - name: Require upstream production deploy job success
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v8
        with:
          script: |
            const upstreamRunId = Number(context.payload.workflow_run?.id || 0);
            if (!Number.isSafeInteger(upstreamRunId) || upstreamRunId < 1) {
              core.setFailed('Missing trusted upstream Deploy production workflow run id.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: upstreamRunId,
              per_page: 100,
            });
            const deployJobs = jobs.filter((job) => job.name === 'deploy');
            if (deployJobs.length !== 1) {
              core.setFailed(`Expected exactly one upstream deploy job, found ${deployJobs.length}.`);
              return;
            }
            const deploy = deployJobs[0];
            if (deploy.status !== 'completed' || deploy.conclusion !== 'success') {
              core.setFailed(`Upstream deploy job did not complete successfully: status=${deploy.status}, conclusion=${deploy.conclusion}.`);
            }

      - name: Validate production connection inputs
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$SITE_DOMAIN" =~ ^[a-z0-9.-]+$ ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve one-time repair state
        id: repair_state
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          repair_marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-surface-repair-v1.done"
          dispatch_marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-surface-repair-v1.static-edge-dispatched"
          state="$(ssh -p "$SSH_PORT" "$USER@$HOST" "REPAIR_MARKER='$repair_marker' DISPATCH_MARKER='$dispatch_marker' bash -s" <<'REMOTE'
          set -euo pipefail
          if ! test -f "$REPAIR_MARKER"; then
            printf '%s' repair
          elif ! test -f "$DISPATCH_MARKER"; then
            printf '%s' dispatch
          else
            printf '%s' complete
          fi
          REMOTE
          )"
          case "$state" in
            repair|dispatch|complete) ;;
            *) echo "Unexpected LordAI repair state: $state" >&2; exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "LordAI Quick surface repair state: $state"

      - name: Reconcile LordAI Quick surfaces to one top and one bottom anchor
        if: steps.repair_state.outputs.state == 'repair'
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-surface-repair-v1.done"
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          ssh -p "$SSH_PORT" "$USER@$HOST" "APP_ROOT='$app_root' SITE_DOMAIN='$SITE_DOMAIN' MARKER='$marker' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          if test -f "$MARKER"; then
            echo "LordAI Quick surface repair already completed: $(cat "$MARKER")"
            exit 0
          fi
          test -f "$APP_ROOT/artisan"
          cd "$APP_ROOT"

          php artisan tinker --execute='
          $domain = strtolower((string) getenv("SITE_DOMAIN"));
          $sites = App\Models\Site::withoutGlobalScopes()
              ->whereNull("deleted_at")
              ->get()
              ->filter(fn ($site) => strtolower(preg_replace("/^www\\./i", "", (string) $site->primary_domain)) === $domain)
              ->values();
          if ($sites->count() !== 1) {
              throw new RuntimeException("Expected exactly one live site for domain ".$domain.", found ".$sites->count().".");
          }
          $site = $sites->first();
          $keepPresets = collect(["sticky_bottom", "sticky_top"]);
          $rolloutCodes = collect([
              "quick_responsive_display",
              "quick_in_article_display",
              "quick_high_impact_display",
              "quick_mobile_display",
          ]);
          $quickPlacements = App\Models\Placement::withoutGlobalScopes()
              ->withTrashed()
              ->where("site_id", $site->id)
              ->get()
              ->filter(fn ($placement) => (bool) data_get($placement->metadata, "quick_monetize_generated", false))
              ->values();

          $keepers = collect();
          foreach ($keepPresets as $preset) {
              $canonicalCode = "quick_".$preset;
              $active = $quickPlacements
                  ->filter(fn ($placement) => ! $placement->trashed()
                      && (string) data_get($placement->metadata, "placement_preset", "") === $preset
                      && $placement->status === App\Enums\PlacementStatus::Active)
                  ->sortByDesc(fn ($placement) => sprintf(
                      "%d-%s-%s",
                      (string) $placement->code === $canonicalCode ? 1 : 0,
                      optional($placement->created_at)->format("YmdHis.u") ?: "0",
                      $placement->id
                  ))
                  ->values();
              if ($active->isEmpty()) {
                  throw new RuntimeException("No active Quick Monetize surface exists for required preset ".$preset.".");
              }
              $keepers->put($preset, $active->first());
          }

          $actorIds = $keepers->flatMap(fn ($placement) => [$placement->updated_by, $placement->created_by])->filter()->unique()->values();
          $actor = null;
          foreach ($actorIds as $actorId) {
              $candidate = App\Models\User::withoutGlobalScopes()->whereNull("deleted_at")->find($actorId);
              if ($candidate) { $actor = $candidate; break; }
          }
          if (! $actor) {
              throw new RuntimeException("Could not resolve a live audit actor from the retained Quick surfaces.");
          }

          $audit = app(App\Services\Audit\AuditRecorder::class);
          $disabled = collect();
          Illuminate\Support\Facades\DB::transaction(function () use ($quickPlacements, $keepers, $keepPresets, $rolloutCodes, $actor, $site, $audit, &$disabled): void {
              foreach ($quickPlacements as $placement) {
                  if ($placement->trashed()) continue;
                  $preset = (string) data_get($placement->metadata, "placement_preset", "");
                  $keeper = $keepers->get($preset);
                  $duplicateAnchor = $keepPresets->contains($preset) && (! $keeper || $keeper->id !== $placement->id);
                  $rolloutDisplay = $rolloutCodes->contains((string) $placement->code);
                  if (! $duplicateAnchor && ! $rolloutDisplay) continue;

                  $reason = $duplicateAnchor ? "duplicate_anchor" : "removed_display_suite_rollout";
                  $demandPlacements = App\Models\DemandPlacement::withoutGlobalScopes()
                      ->where("placement_id", $placement->id)
                      ->get();
                  foreach ($demandPlacements as $mapping) {
                      $widgets = App\Models\DemandWidget::withoutGlobalScopes()
                          ->where("demand_placement_id", $mapping->id)
                          ->where("is_enabled", true)
                          ->get();
                      foreach ($widgets as $widget) {
                          $widget->update(["is_enabled" => false]);
                          $audit->record(
                              "ops.quick_surface_repair.widget_disabled",
                              $widget->organization_id,
                              $actor,
                              $widget,
                              ["is_enabled" => true],
                              ["is_enabled" => false],
                              ["site_id" => $site->id, "placement_code" => $placement->code, "reason" => $reason]
                          );
                      }

                      if ((bool) $mapping->is_enabled) {
                          $mapping->update(["is_enabled" => false, "updated_by" => $actor->id]);
                          $audit->record(
                              "ops.quick_surface_repair.mapping_disabled",
                              $mapping->organization_id,
                              $actor,
                              $mapping,
                              ["is_enabled" => true],
                              ["is_enabled" => false],
                              ["site_id" => $site->id, "placement_code" => $placement->code, "reason" => $reason]
                          );
                      }
                  }

                  if ($placement->status !== App\Enums\PlacementStatus::Disabled) {
                      $beforeStatus = $placement->status->value;
                      $placement->update([
                          "status" => App\Enums\PlacementStatus::Disabled,
                          "updated_by" => $actor->id,
                      ]);
                      $audit->record(
                          "ops.quick_surface_repair.placement_disabled",
                          $placement->organization_id,
                          $actor,
                          $placement,
                          ["status" => $beforeStatus],
                          ["status" => App\Enums\PlacementStatus::Disabled->value],
                          ["site_id" => $site->id, "placement_code" => $placement->code, "preset" => $preset, "reason" => $reason]
                      );
                  }

                  $disabled->push(["code" => $placement->code, "preset" => $preset, "reason" => $reason]);
              }

              $audit->record(
                  "ops.quick_surface_repair.completed",
                  $site->organization_id,
                  $actor,
                  $site,
                  [],
                  [
                      "kept" => $keepers->map(fn ($placement) => ["code" => $placement->code, "preset" => data_get($placement->metadata, "placement_preset")])->values()->all(),
                      "disabled" => $disabled->values()->all(),
                  ],
                  ["source" => "lordai-quick-surface-repair-v1"]
              );
          });

          app(App\Services\Inventory\SiteConfigPublisher::class)->publishActiveProduction($site->fresh(), $actor);

          $activeQuick = App\Models\Placement::withoutGlobalScopes()
              ->where("site_id", $site->id)
              ->whereNull("deleted_at")
              ->get()
              ->filter(fn ($placement) => (bool) data_get($placement->metadata, "quick_monetize_generated", false)
                  && $placement->status === App\Enums\PlacementStatus::Active)
              ->values();
          $activePresets = $activeQuick->map(fn ($placement) => (string) data_get($placement->metadata, "placement_preset", ""));
          foreach (["sticky_bottom", "sticky_top"] as $preset) {
              if ($activePresets->filter(fn ($value) => $value === $preset)->count() !== 1) {
                  throw new RuntimeException("Expected exactly one active ".$preset." after reconciliation.");
              }
          }
          $remainingRolloutDisplays = $activeQuick->filter(fn ($placement) => $rolloutCodes->contains((string) $placement->code))->values();
          if ($remainingRolloutDisplays->isNotEmpty()) {
              throw new RuntimeException("Unintended rollout display surfaces remain active: ".$remainingRolloutDisplays->pluck("code")->implode(", "));
          }

          $activeAnchors = $activeQuick
              ->filter(fn ($placement) => $keepPresets->contains((string) data_get($placement->metadata, "placement_preset", "")))
              ->values();
          $preservedQuick = $activeQuick
              ->reject(fn ($placement) => $keepPresets->contains((string) data_get($placement->metadata, "placement_preset", "")))
              ->values();
          echo json_encode([
              "site_key" => $site->public_key,
              "active_anchors" => $activeAnchors->map(fn ($placement) => ["code" => $placement->code, "preset" => data_get($placement->metadata, "placement_preset")])->values()->all(),
              "preserved_quick_surfaces" => $preservedQuick->map(fn ($placement) => ["code" => $placement->code, "preset" => data_get($placement->metadata, "placement_preset")])->values()->all(),
              "disabled" => $disabled->values()->all(),
          ], JSON_THROW_ON_ERROR).PHP_EOL;
          '

          install -d -m 700 "$(dirname "$MARKER")"
          tmp="${MARKER}.tmp.$$"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) site=$SITE_DOMAIN deployment=${GITHUB_RUN_ID:-workflow}" > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$MARKER"
          REMOTE

      - name: Trigger immediate static-edge reconciliation
        if: steps.repair_state.outputs.state == 'repair' || steps.repair_state.outputs.state == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-production-static-edge.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Mark static-edge reconciliation dispatched
        if: steps.repair_state.outputs.state == 'repair' || steps.repair_state.outputs.state == 'dispatch'
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          dispatch_marker="$REMOTE_HOME/shared/storage/app/ops/lordai-quick-surface-repair-v1.static-edge-dispatched"
          ssh -p "$SSH_PORT" "$USER@$HOST" "DISPATCH_MARKER='$dispatch_marker' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 "$(dirname "$DISPATCH_MARKER")"
          tmp="${DISPATCH_MARKER}.tmp.$$"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) dispatch_run=${GITHUB_RUN_ID:-workflow}" > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$DISPATCH_MARKER"
          REMOTE
