name: Task 15 Loader Freshness Patch

on:
  push:
    branches:
      - task-15-standalone-prebid-runtime

permissions:
  contents: write

jobs:
  apply-loader-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-15-standalone-prebid-runtime
          fetch-depth: 0
      - name: Apply and validate freshness guard
        run: |
          set -euo pipefail
          git apply --check scripts/task15-loader-freshness.patch
          git apply scripts/task15-loader-freshness.patch
          node --check public/assets/hm-loader.js
          rm scripts/task15-loader-freshness.patch
          rm .github/workflows/task15-apply-loader-freshness.yml
      - name: Commit materialized guard
        run: |
          set -euo pipefail
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 15: harden standalone winner freshness"
          git push origin HEAD:task-15-standalone-prebid-runtime
