name: Main website — Cloudflare Worker

on:
  pull_request:
    paths:
      - "website/**"
      - "website-worker.mjs"
      - "scripts/test-main-website-worker.mjs"
      - "scripts/validate-main-website.mjs"
      - "wrangler.website.jsonc"
      - ".github/workflows/website-cloudflare-pages.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "website-worker.mjs"
      - "scripts/test-main-website-worker.mjs"
      - "scripts/validate-main-website.mjs"
      - "wrangler.website.jsonc"
      - ".github/workflows/website-cloudflare-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horus-main-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate main website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:main-website

  deploy:
    name: Deploy plain-truth-6412
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Deploy production website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.website.jsonc --keep-vars
      - name: Verify deployed Worker assets
        run: |
          for path in / /terms/ /privacy/ /publisher-terms/; do
            curl --fail --silent --show-error --retry 8 --retry-delay 5 \
              "https://plain-truth-6412.mohamed-wahieed.workers.dev${path}" >/dev/null
          done
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 \
            "https://plain-truth-6412.mohamed-wahieed.workers.dev/sellers.json" >/dev/null
      - name: Probe production custom domain
        run: |
          for path in / /terms/ /privacy/ /publisher-terms/; do
            status="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://horusmedia.net${path}" || true)"
            case "$status" in
              200)
                ;;
              403)
                echo "::warning::Cloudflare security denied the GitHub runner for ${path}; the authoritative Worker asset probe passed."
                ;;
              *)
                echo "Unexpected production status for ${path}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          done
          sellers_location="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{redirect_url}' \
            "https://horusmedia.net/sellers.json" || true)"
          if [ "$sellers_location" != "https://cdn.horusmedia.net/sellers.json" ]; then
            echo "Unexpected canonical sellers.json redirect: ${sellers_location:-none}" >&2
            exit 1
          fi
