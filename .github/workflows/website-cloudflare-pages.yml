name: Main website — Cloudflare Worker

on:
  pull_request:
    paths:
      - "website/**"
      - "scripts/validate-main-website.mjs"
      - "wrangler.website.jsonc"
      - ".github/workflows/website-cloudflare-pages.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/validate-main-website.mjs"
      - "wrangler.website.jsonc"
      - ".github/workflows/website-cloudflare-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horus-main-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate main website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:main-website

  deploy:
    name: Deploy plain-truth-6412
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Deploy production website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.website.jsonc --keep-vars
      - name: Verify production pages
        run: |
          for path in / /terms/ /privacy/ /publisher-terms/; do
            curl --fail --silent --show-error --retry 8 --retry-delay 5 "https://horusmedia.net${path}" >/dev/null
          done
