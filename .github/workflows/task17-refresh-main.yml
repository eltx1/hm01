name: Task17 Refresh Main

'on':
  push:
    branches:
      - task-17-universal-direct-js-demand-engine

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-17-universal-direct-js-demand-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge latest main and preserve both loader hardenings
        run: |
          set -euo pipefail
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            git checkout --ours public/assets/hm-loader.js
            python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('public/assets/hm-loader.js')
          text = path.read_text()
          pattern = re.compile(r"    function ensureElementId\(element, config, placement\) \{.*?\n    \}\n\n    function nativeDefinition", re.S)
          replacement = """    function ensureElementId(element, config, placement) {
              if (element.id) return element.id;
              var safeSite = String(config.siteKey).replace(/[^A-Za-z0-9_-]/g, '');
              var safePlacement = String(placement.code).replace(/[^A-Za-z0-9_-]/g, '');
              var sequence = Number(state.elementSequence);
              if (!Number.isFinite(sequence) || sequence < 0) sequence = 0;
              state.elementSequence = sequence + 1;
              element.id = 'hm-' + safeSite + '-' + safePlacement + '-' + sequence;
              return element.id;
          }

          function nativeDefinition"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Task 17 ensureElementId function marker missing')
          reset_old = """            state.nativeAttempts = {};
              state.nativeRendered = {};
          """
          reset_new = """            state.nativeAttempts = {};
              state.nativeRendered = {};
              state.directScripts = {};
              state.directTaboolaFlushScheduled = false;
              state.elementSequence = 0;
          """
          if reset_old not in text:
              raise SystemExit('Task 17 runtime reset marker missing')
          text = text.replace(reset_old, reset_new, 1)
          path.write_text(text)

          test_path = Path('tests/Browser/hm-loader-direct-demand.test.js')
          test_text = test_path.read_text()
          test_text = test_text.replace('blockedUntil: Date.now() + 60_000', 'blockedUntil: Date.now() + 500')
          test_path.write_text(test_text)
          PY
            git add public/assets/hm-loader.js tests/Browser/hm-loader-direct-demand.test.js
            git commit --no-edit
          fi
          node --check public/assets/hm-loader.js
          node --test tests/Browser/hm-loader-prebid-mode-hardening.test.js tests/Browser/hm-loader-direct-demand.test.js
          rm .github/workflows/task17-refresh-main.yml
          git add -A
          git commit -m "Task 17: remove temporary main refresh workflow"
          git push origin HEAD:task-17-universal-direct-js-demand-engine
