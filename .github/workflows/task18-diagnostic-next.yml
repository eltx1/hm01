name: Task18 Next Diagnostic

'on':
  push:
    branches:
      - task-18-direct-demand-admin-control-center

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-18-direct-demand-admin-control-center
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, soap
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Capture next failure
        run: |
          cp .env.example .env
          php artisan key:generate
          set +e
          php artisan test --stop-on-failure 2>&1 | tee task18-next-failure.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: task18-next-failure
          path: task18-next-failure.log
          retention-days: 1
