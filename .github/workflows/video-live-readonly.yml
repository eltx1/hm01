name: Read-only public video delivery probe
on:
  push:
    branches: [diagnostic/video-black-flash-20260929]
    paths: [.github/workflows/video-live-readonly.yml]
permissions:
  contents: read
jobs:
  public-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify public error pages, do not request ads
        shell: python
        run: |
          import urllib.request, urllib.error, json, re, html
          urls=['https://cdn.horusmedia.net/configs/hm_ircll0vkqq54jvt9gz85mrh2/production.json','https://91ba8e4b.horus-media-cdn.pages.dev/configs/hm_ircll0vkqq54jvt9gz85mrh2/production.json']
          for url in urls:
              try:
                  with urllib.request.urlopen(url,timeout=20) as r:
                      print(json.dumps({'url':url,'status':r.status,'type':r.headers.get('Content-Type')}))
              except urllib.error.HTTPError as e:
                  body=e.read(32000).decode('utf8',errors='replace')
                  headings=re.findall(r'<(?:title|h1|h2)[^>]*>(.*?)</(?:title|h1|h2)>',body,re.S|re.I)
                  headings=[html.unescape(re.sub('<[^>]+>',' ',v)).strip()[:500] for v in headings]
                  print(json.dumps({'url':url,'status':e.code,'cf_mitigated':e.headers.get('cf-mitigated'),'headings':headings,'error_codes':re.findall(r'Error\s*(?:code)?\s*:?\s*(\d{3,5})',re.sub('<[^>]+>',' ',body),re.I)[:5]}))
              except Exception as e: print(json.dumps({'url':url,'error':str(e)}))
