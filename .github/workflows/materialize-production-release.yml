name: Materialize production-ready Horus release

on:
  push:
    branches:
      - agent/production-readiness-release
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/production-readiness-release

      - name: Materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .production-release-bootstrap/part-* > /tmp/horus-production-payload.b64
          base64 --decode /tmp/horus-production-payload.b64 > /tmp/horus-production-implementation.tar.gz
          echo "88def67b1fccb89564f945c9a06d04da0430cea23861482db605ba7f5cbacc84  /tmp/horus-production-implementation.tar.gz" | sha256sum -c -
          gzip -t /tmp/horus-production-implementation.tar.gz
          tar -xzf /tmp/horus-production-implementation.tar.gz
          rm -rf .production-release-bootstrap
          rm -f .github/workflows/production-audit-bootstrap.yml
          rm -f .github/workflows/materialize-production-release.yml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, soap, openssl, fileinfo
          coverage: none

      - name: Validate PHP and production static analysis
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/static-analysis.php

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate SQLite migrations, routes, schedule, and full PHP suite
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite"
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan route:list
          php artisan schedule:list
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and validate browser distributions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run test:browser
          npm run build
          test -s public/build/manifest.json
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.min.js
          grep -q "1.3.0" public/assets/hm-loader.min.js

      - name: Commit production implementation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .production-release-bootstrap
          test ! -e .github/workflows/production-audit-bootstrap.yml
          test ! -e .github/workflows/materialize-production-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden and package the production-ready Horus Media platform"
          git push origin HEAD:agent/production-readiness-release
