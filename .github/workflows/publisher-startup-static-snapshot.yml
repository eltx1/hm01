name: Publisher startup static snapshot
on:
  push:
    branches: [diagnostic/video-black-flash-20260929]
    paths: [.github/workflows/publisher-startup-static-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only public configuration HTML and first-party runtime bytes
        shell: python
        run: |
          import urllib.request, urllib.parse, json, pathlib, hashlib
          out=pathlib.Path('publisher-static'); out.mkdir()
          root='https://e5b5a3a3.horus-media-cdn.pages.dev'
          report=[]; scripts=set()
          def get(url,name):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; HorusMedia-ReadOnly/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(4000000); status=r.status; kind=r.headers.get('content-type')
              if len(data)>=4000000: raise ValueError('Oversized static response')
              (out/name).write_bytes(data)
              report.append({'file':name,'url':url,'status':status,'type':kind,'sha256':hashlib.sha256(data).hexdigest()})
              return data
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k in ['url','scriptUrl','assetUrl'] and isinstance(v,str):
                          p=urllib.parse.urlsplit(v)
                          if p.scheme=='https' and p.hostname=='cdn.horusmedia.net' and (p.path.startswith('/runtime/') or p.path.startswith('/hm-loader')): scripts.add(p.path)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          get(root+'/delivery-manifest.json','manifest.json')
          get(root+'/hm-loader.js','hm-loader.js')
          for domain,key in [('natega.bluekl.com','hm_dugvamtfxlbeknptexbsqtpp'),('lordai.net','hm_ircll0vkqq54jvt9gz85mrh2')]:
              data=get(root+'/configs/'+key+'/production.json',domain+'.config.json'); walk(json.loads(data))
              try: get('https://'+domain+'/',domain+'.html')
              except Exception as e: report.append({'domain':domain,'error':str(e)})
          for path in sorted(scripts): get(root+path,path.rsplit('/',1)[-1])
          (out/'report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: publisher-startup-static
          path: publisher-static
          retention-days: 3
          if-no-files-found: error
