name: Generate Composer lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  composer-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: soap
          coverage: none
      - run: composer update googleads/googleads-php-lib --with-all-dependencies --no-interaction --no-progress --no-scripts
      - run: composer validate --strict
      - name: Commit resolved lock
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Lock official Google Ads PHP library"
            git push
          fi
