name: Generate Composer lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  composer-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: soap
          coverage: none
      - run: composer update googleads/googleads-php-lib --with-all-dependencies --no-interaction --no-progress --no-scripts
      - run: composer validate --strict
      - name: Emit resolved lock
        run: |
          echo HORUS_LOCK_BEGIN
          base64 composer.lock
          echo
          echo HORUS_LOCK_END
