name: Sync production static edge

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Deploy production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horus-production-static-edge-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      CDN_URL: https://cdn.horusmedia.net
      GATE_URL: https://verify.horusmedia.net
      PUBLIC_URL: https://horusmedia.net
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate sync configuration
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build snapshot from live production data
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          mkdir -p "$RUNNER_TEMP/static-edge"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "mkdir -p '$remote_dir' && cd '$app_root' && php artisan static-delivery:build '$remote_dir'"
          ssh -p "$SSH_PORT" "$USER@$HOST" "tar -C '$remote_dir' -czf - ." \
            | tar -xzf - -C "$RUNNER_TEMP/static-edge"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "cat '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest' 2>/dev/null || true" \
            > "$RUNNER_TEMP/confirmed-manifest"
          ssh -p "$SSH_PORT" "$USER@$HOST" "rm -rf '$remote_dir'"

      - name: Validate sanitized production snapshot
        run: php scripts/validate-static-delivery.php "$RUNNER_TEMP/static-edge"

      - name: Compare complete public snapshot
        id: compare
        run: |
          set -euo pipefail

          verify_snapshot() {
            local root="$1"
            local base="${2%/}"
            local probe="$3"
            local remote_file="$RUNNER_TEMP/static-edge-public.bin"
            while IFS=$'\t' read -r expected path; do
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              [[ "$path" != /* && "$path" != *..* ]]
              case "$path" in
                _headers|_routes.json) continue ;;
              esac
              if ! curl --fail --silent --show-error --location --globoff --max-time 20 \
                --retry 2 --retry-delay 1 \
                --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
                "${base}/${path}?edge_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${probe}" \
                --output "$remote_file"; then
                echo "Public edge is missing ${path} at ${base}." >&2
                return 1
              fi
              actual="$(sha256sum "$remote_file" | awk '{print $1}')"
              if [[ "$actual" != "$expected" ]]; then
                echo "Public edge hash mismatch for ${path} at ${base}: expected ${expected}, got ${actual}." >&2
                return 1
              fi
            done < <(php -r '
              $d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              foreach (($d["files"] ?? []) as $path => $sha) {
                echo $sha, "\t", $path, "\n";
              }
            ' "$root/delivery-manifest.json")
          }

          local_hash="$(php -r '$d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $d["manifestHash"] ?? "";' "$RUNNER_TEMP/static-edge/delivery-manifest.json")"
          [[ "$local_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_hash=$local_hash" >> "$GITHUB_OUTPUT"

          confirmed_hash="$(tr -d '[:space:]' < "$RUNNER_TEMP/confirmed-manifest")"
          if [[ "$confirmed_hash" =~ ^[0-9a-f]{64}$ && "$confirmed_hash" == "$local_hash" ]]; then
            echo "Control-plane marker matches $local_hash; verifying the public edge before trusting it."
          fi

          if verify_snapshot "$RUNNER_TEMP/static-edge" "$CDN_URL" compare; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Canonical public edge contains the complete snapshot $local_hash."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Canonical public edge is incomplete or stale; deployment is required."
          fi

      - name: Deploy live snapshot to Cloudflare Pages
        if: steps.compare.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/static-edge --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'horus-media-cdn' }} --branch=main

      - name: Verify exact Pages deployment and canonical edge
        if: steps.compare.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+\.pages\.dev/?$ ]]

          verify_snapshot() {
            local root="$1"
            local base="${2%/}"
            local probe="$3"
            local remote_file="$RUNNER_TEMP/static-edge-public.bin"
            while IFS=$'\t' read -r expected path; do
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              [[ "$path" != /* && "$path" != *..* ]]
              case "$path" in
                _headers|_routes.json) continue ;;
              esac
              if ! curl --fail --silent --show-error --location --globoff --max-time 20 \
                --retry 1 --retry-delay 1 \
                --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
                "${base}/${path}?edge_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${probe}" \
                --output "$remote_file"; then
                return 1
              fi
              actual="$(sha256sum "$remote_file" | awk '{print $1}')"
              [[ "$actual" == "$expected" ]] || return 1
            done < <(php -r '
              $d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              foreach (($d["files"] ?? []) as $path => $sha) {
                echo $sha, "\t", $path, "\n";
              }
            ' "$root/delivery-manifest.json")
          }

          pages_ok=false
          for attempt in $(seq 1 18); do
            if verify_snapshot "$RUNNER_TEMP/static-edge" "$DEPLOYMENT_URL" "pages-$attempt"; then
              pages_ok=true
              break
            fi
            sleep 10
          done
          if [[ "$pages_ok" != true ]]; then
            echo 'Cloudflare Pages did not expose the complete exact deployment within the verification window.' >&2
            exit 1
          fi

          cdn_ok=false
          for attempt in $(seq 1 18); do
            if verify_snapshot "$RUNNER_TEMP/static-edge" "$CDN_URL" "cdn-$attempt"; then
              cdn_ok=true
              break
            fi
            sleep 10
          done
          if [[ "$cdn_ok" != true ]]; then
            echo 'The canonical CDN did not expose the complete exact deployment within the verification window.' >&2
            exit 1
          fi

          status="$(curl -sSL --max-time 20 --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
            --output "$RUNNER_TEMP/public-sellers.json" --write-out '%{http_code}' "$PUBLIC_URL/sellers.json?verify=$GITHUB_RUN_ID")"
          if [[ "$status" == '200' ]]; then
            cmp -s "$RUNNER_TEMP/static-edge/sellers.json" "$RUNNER_TEMP/public-sellers.json"
          elif [[ "$status" == '403' ]]; then
            echo "::warning::Cloudflare WAF blocked the GitHub Runner probe for $PUBLIC_URL/sellers.json; canonical CDN parity was verified."
          else
            echo "Unexpected public-site status $status for $PUBLIC_URL/sellers.json" >&2
            exit 1
          fi

      - name: Verify Traffic Gate origin before confirmation
        run: |
          set -euo pipefail
          local_hash="${{ steps.compare.outputs.manifest_hash }}"
          expected_gate_js="$(sha256sum "$RUNNER_TEMP/static-edge/assets/traffic-gate/horus-traffic-gate.js" | awk '{print $1}')"
          gate_ok=false

          for attempt in $(seq 1 12); do
            manifest_file="$RUNNER_TEMP/gate-delivery-manifest.json"
            gate_html="$RUNNER_TEMP/gate.html"
            gate_js="$RUNNER_TEMP/gate.js"
            gate_headers="$RUNNER_TEMP/gate.headers"

            if curl --fail --silent --show-error --location --globoff --max-time 20 \
                --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
                "$GATE_URL/delivery-manifest.json?edge_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest-$attempt" \
                --output "$manifest_file"; then
              remote_hash="$(php -r '$d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $d["manifestHash"] ?? "";' "$manifest_file" 2>/dev/null || true)"
            else
              remote_hash=''
            fi

            if [[ "$remote_hash" == "$local_hash" ]] \
              && curl --fail --silent --show-error --location --globoff --max-time 20 \
                --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
                --dump-header "$gate_headers" \
                "$GATE_URL/traffic-gate/?edge_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-page-$attempt" \
                --output "$gate_html" \
              && grep -Fq '<title>Horus Client Traffic Gate</title>' "$gate_html" \
              && grep -Fq '/assets/traffic-gate/horus-traffic-gate.js' "$gate_html" \
              && curl --fail --silent --show-error --location --globoff --max-time 20 \
                --user-agent 'Mozilla/5.0 Horus-Static-Sync/2.0' \
                "$GATE_URL/assets/traffic-gate/horus-traffic-gate.js?edge_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-js-$attempt" \
                --output "$gate_js"; then
              actual_gate_js="$(sha256sum "$gate_js" | awk '{print $1}')"
              csp="$(tr -d '\r' < "$gate_headers" | awk 'BEGIN{IGNORECASE=1} /^Content-Security-Policy:/ {line=$0} END{sub(/^[^:]+:[[:space:]]*/, "", line); print line}')"
              if [[ "$actual_gate_js" == "$expected_gate_js" \
                && "$csp" == *"script-src 'self' https://challenges.cloudflare.com"* \
                && "$csp" == *"frame-src https://challenges.cloudflare.com"* \
                && "$csp" == *"connect-src 'self' https://challenges.cloudflare.com"* \
                && "$csp" == *"frame-ancestors https:"* ]]; then
                gate_ok=true
                break
              fi
            fi

            sleep 5
          done

          if [[ "$gate_ok" != true ]]; then
            echo 'Traffic Gate custom origin is stale, incomplete, or missing its enforced Turnstile CSP; refusing production confirmation.' >&2
            exit 1
          fi

      - name: Confirm manifest on production control plane
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          MANIFEST_HASH: ${{ steps.compare.outputs.manifest_hash }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_HASH" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$MANIFEST_HASH" | ssh -p "$SSH_PORT" "$USER@$HOST" \
            "set -e; umask 077; mkdir -p '$REMOTE_HOME/shared/storage/app/static-delivery'; cat > '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest.tmp'; mv '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest.tmp' '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest'"

      - name: Remove remote snapshot if interrupted
        if: always()
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -p "$SSH_PORT" "$USER@$HOST" "rm -rf '$remote_dir'" || true
