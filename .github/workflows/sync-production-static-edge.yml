name: Sync production static edge

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Deploy production
      - LordAI Quick Monetize display suite
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horus-production-static-edge-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_PORT: ${{ vars.HORUS_PRODUCTION_SSH_PORT || '22' }}
      REMOTE_HOME: ${{ vars.HORUS_PRODUCTION_HOME || '/home/horusapp' }}
      CDN_URL: https://cdn.horusmedia.net
      GATE_URL: https://verify.horusmedia.net
      PUBLIC_URL: https://horusmedia.net
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'horus-media-cdn' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate sync configuration
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash -n scripts/verify-static-edge-public.sh
          bash -n scripts/verify-traffic-gate-public.sh
          bash -n scripts/verify-cloudflare-pages-domain-active.sh
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_HOME" == /* ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Configure pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.HORUS_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HORUS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build snapshot from live production data
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          app_root="$REMOTE_HOME/htdocs/app.horusmedia.net"
          mkdir -p "$RUNNER_TEMP/static-edge"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "mkdir -p '$remote_dir' && cd '$app_root' && (test ! -f app/Console/Commands/RefreshQuickRuntimeConfigs.php || php artisan demand:refresh-quick-runtimes --apply) && php artisan static-delivery:build '$remote_dir'"
          ssh -p "$SSH_PORT" "$USER@$HOST" "tar -C '$remote_dir' -czf - ." \
            | tar -xzf - -C "$RUNNER_TEMP/static-edge"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "cat '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest' 2>/dev/null || true" \
            > "$RUNNER_TEMP/confirmed-manifest"

          # Keep the authoritative production-built snapshot until the final
          # cleanup. It doubles as an independent verification point when the
          # Cloudflare WAF blocks GitHub-hosted runner IPs with HTTP 403.
          scp -P "$SSH_PORT" \
            scripts/verify-static-edge-public.sh \
            scripts/verify-traffic-gate-public.sh \
            "$USER@$HOST:$remote_dir/"
          ssh -p "$SSH_PORT" "$USER@$HOST" \
            "chmod 700 '$remote_dir/verify-static-edge-public.sh' '$remote_dir/verify-traffic-gate-public.sh'"

      - name: Validate sanitized production snapshot
        run: |
          php scripts/validate-static-delivery.php "$RUNNER_TEMP/static-edge"
          # Public configuration only: expose exactly which surfaces reached the
          # snapshot, so a successful upload cannot hide a missing rewarded unit.
          php -r '
          foreach (glob($argv[1]."/configs/*/production.json") ?: [] as $file) {
              $config = json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              $surfaces = array_map(static fn ($p) => [
                  "code" => $p["code"] ?? null,
                  "type" => $p["type"] ?? null,
                  "enabled" => $p["enabled"] ?? false,
                  "renderer" => $p["renderer"] ?? null,
                  "autoMount" => $p["format"]["settings"]["autoMount"] ?? null,
              ], $config["placements"] ?? []);
              echo "Public surfaces: ".json_encode([
                  "siteKey" => $config["siteKey"] ?? null,
                  "configVersion" => $config["configVersion"] ?? null,
                  "protection" => [
                      "trafficGateEnabled" => $config["trafficGate"]["enabled"] ?? false,
                      "trafficGateReadiness" => $config["trafficGate"]["readiness"] ?? null,
                      "trafficGateDisabledByControl" => $config["controls"]["trafficGateDisabled"] ?? false,
                      "clickGuardEnabled" => $config["clickGuard"]["enabled"] ?? false,
                  ],
                  "placements" => $surfaces,
              ], JSON_THROW_ON_ERROR).PHP_EOL;
          }' "$RUNNER_TEMP/static-edge"

      - name: Compare complete public snapshot
        id: compare
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          local_hash="$(php -r '$d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $d["manifestHash"] ?? "";' "$RUNNER_TEMP/static-edge/delivery-manifest.json")"
          [[ "$local_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_hash=$local_hash" >> "$GITHUB_OUTPUT"

          confirmed_hash="$(tr -d '[:space:]' < "$RUNNER_TEMP/confirmed-manifest")"
          if [[ "$confirmed_hash" =~ ^[0-9a-f]{64}$ && "$confirmed_hash" == "$local_hash" ]]; then
            echo "Control-plane marker matches $local_hash; verifying the public edge before trusting it."
          fi

          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          edge_ok=false
          if bash scripts/verify-static-edge-public.sh "$RUNNER_TEMP/static-edge" "$CDN_URL" compare 32; then
            edge_ok=true
          else
            echo '::warning::Direct CDN verification from the GitHub runner failed; retrying complete parity from the pinned production host.'
            if ssh -p "$SSH_PORT" "$USER@$HOST" \
              "RUNNER_TEMP=/tmp GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$remote_dir/verify-static-edge-public.sh' '$remote_dir' '$CDN_URL' 'compare-origin' 16"; then
              edge_ok=true
            fi
          fi

          if [[ "$edge_ok" == true ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Canonical public edge contains the complete snapshot $local_hash, including the root manifest."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Canonical public edge is incomplete or stale; deployment is required."
          fi

      # Cloudflare Pages can occasionally return a transient internal Function
      # publication error after every static file has uploaded successfully.
      # Keep the deploy fail-closed, but retry the whole atomic Pages publish
      # rather than leaving production on the previous loader/config snapshot.
      - name: Deploy live snapshot to Cloudflare Pages · attempt 1
        if: steps.compare.outputs.deploy == 'true'
        id: deploy_attempt_1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/static-edge --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'horus-media-cdn' }} --branch=main

      - name: Deploy live snapshot to Cloudflare Pages · attempt 2
        if: steps.compare.outputs.deploy == 'true' && steps.deploy_attempt_1.outcome != 'success'
        id: deploy_attempt_2
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/static-edge --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'horus-media-cdn' }} --branch=main

      - name: Deploy live snapshot to Cloudflare Pages · attempt 3
        if: steps.compare.outputs.deploy == 'true' && steps.deploy_attempt_1.outcome != 'success' && steps.deploy_attempt_2.outcome != 'success'
        id: deploy_attempt_3
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/static-edge --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'horus-media-cdn' }} --branch=main

      - name: Resolve successful Pages deployment
        if: steps.compare.outputs.deploy == 'true'
        id: deploy
        env:
          ATTEMPT_1_OUTCOME: ${{ steps.deploy_attempt_1.outcome }}
          ATTEMPT_1_URL: ${{ steps.deploy_attempt_1.outputs.deployment-url }}
          ATTEMPT_2_OUTCOME: ${{ steps.deploy_attempt_2.outcome }}
          ATTEMPT_2_URL: ${{ steps.deploy_attempt_2.outputs.deployment-url }}
          ATTEMPT_3_OUTCOME: ${{ steps.deploy_attempt_3.outcome }}
          ATTEMPT_3_URL: ${{ steps.deploy_attempt_3.outputs.deployment-url }}
        run: |
          set -euo pipefail
          deployment_url=''
          for candidate in \
            "$ATTEMPT_1_OUTCOME|$ATTEMPT_1_URL" \
            "$ATTEMPT_2_OUTCOME|$ATTEMPT_2_URL" \
            "$ATTEMPT_3_OUTCOME|$ATTEMPT_3_URL"; do
            outcome="${candidate%%|*}"
            url="${candidate#*|}"
            if [[ "$outcome" == 'success' && "$url" =~ ^https://[A-Za-z0-9.-]+\.pages\.dev/?$ ]]; then
              deployment_url="$url"
              break
            fi
          done
          if [[ -z "$deployment_url" ]]; then
            echo 'All Cloudflare Pages deployment attempts failed; refusing to confirm the production manifest.' >&2
            exit 1
          fi
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify exact Pages deployment and canonical edge
        if: steps.compare.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+\.pages\.dev/?$ ]]

          pages_ok=false
          for attempt in $(seq 1 18); do
            if bash scripts/verify-static-edge-public.sh "$RUNNER_TEMP/static-edge" "$DEPLOYMENT_URL" "pages-$attempt" 32; then
              pages_ok=true
              break
            fi
            sleep 10
          done
          if [[ "$pages_ok" != true ]]; then
            echo 'Cloudflare Pages did not expose the complete exact deployment within the verification window.' >&2
            exit 1
          fi

          # At this point the authoritative Pages deployment has exact full-file
          # parity. If the custom hostname returns HTTP 403 only to machine
          # probes, allow the verifier to accept that status solely when the
          # Cloudflare API confirms the hostname is active on this Pages project.
          cdn_ok=false
          for attempt in $(seq 1 2); do
            if HORUS_ALLOW_CLOUDFLARE_WAF_403_FALLBACK=1 \
              bash scripts/verify-static-edge-public.sh "$RUNNER_TEMP/static-edge" "$CDN_URL" "cdn-$attempt" 32; then
              cdn_ok=true
              break
            fi
            sleep 3
          done

          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$cdn_ok" != true ]]; then
            echo '::warning::GitHub runner could not prove canonical CDN parity; retrying from the pinned production host.'
            for attempt in $(seq 1 6); do
              if ssh -p "$SSH_PORT" "$USER@$HOST" \
                "RUNNER_TEMP=/tmp GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$remote_dir/verify-static-edge-public.sh' '$remote_dir' '$CDN_URL' 'cdn-origin-$attempt' 16"; then
                cdn_ok=true
                break
              fi
              sleep 5
            done
          fi

          if [[ "$cdn_ok" != true ]]; then
            echo 'The canonical CDN did not expose the complete exact deployment and no guarded WAF 403 proof was available.' >&2
            exit 1
          fi

          status="$(curl -sSL --max-time 20 --user-agent 'Mozilla/5.0 Horus-Static-Sync/3.1' \
            --output "$RUNNER_TEMP/public-sellers.json" --write-out '%{http_code}' "$PUBLIC_URL/sellers.json?verify=$GITHUB_RUN_ID")"
          if [[ "$status" == '200' ]]; then
            cmp -s "$RUNNER_TEMP/static-edge/sellers.json" "$RUNNER_TEMP/public-sellers.json"
          elif [[ "$status" == '403' ]]; then
            echo "::warning::Cloudflare WAF blocked the GitHub Runner probe for $PUBLIC_URL/sellers.json; authoritative Pages parity and custom-domain control-plane proof passed."
          else
            echo "Unexpected public-site status $status for $PUBLIC_URL/sellers.json" >&2
            exit 1
          fi

      - name: Verify Traffic Gate origin before confirmation
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          gate_waf_fallback=0

          # When this run deployed a new authoritative Pages snapshot, verify
          # the Traffic Gate page, JS and enforced CSP on that exact deployment
          # before any custom-domain 403 can be treated as WAF-only visibility.
          if [[ -n "${DEPLOYMENT_URL:-}" ]]; then
            [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+\.pages\.dev/?$ ]]
            bash scripts/verify-traffic-gate-public.sh "$RUNNER_TEMP/static-edge" "$DEPLOYMENT_URL" gate-pages
            gate_waf_fallback=1
          fi

          gate_ok=false
          for attempt in $(seq 1 3); do
            if HORUS_ALLOW_CLOUDFLARE_WAF_403_FALLBACK="$gate_waf_fallback" \
              bash scripts/verify-traffic-gate-public.sh "$RUNNER_TEMP/static-edge" "$GATE_URL" "gate-$attempt"; then
              gate_ok=true
              break
            fi
            sleep 3
          done

          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$gate_ok" != true ]]; then
            echo '::warning::GitHub runner could not prove Traffic Gate parity; retrying from the pinned production host.'
            for attempt in $(seq 1 6); do
              if ssh -p "$SSH_PORT" "$USER@$HOST" \
                "RUNNER_TEMP=/tmp GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash '$remote_dir/verify-traffic-gate-public.sh' '$remote_dir' '$GATE_URL' 'gate-origin-$attempt'"; then
                gate_ok=true
                break
              fi
              sleep 5
            done
          fi

          if [[ "$gate_ok" != true ]]; then
            echo 'Traffic Gate custom origin is stale, incomplete, blocked without a guarded WAF proof, or missing its enforced Turnstile CSP; refusing production confirmation.' >&2
            exit 1
          fi

      - name: Confirm manifest on production control plane
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
          MANIFEST_HASH: ${{ steps.compare.outputs.manifest_hash }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_HASH" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$MANIFEST_HASH" | ssh -p "$SSH_PORT" "$USER@$HOST" \
            "set -e; umask 077; mkdir -p '$REMOTE_HOME/shared/storage/app/static-delivery'; cat > '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest.tmp'; mv '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest.tmp' '$REMOTE_HOME/shared/storage/app/static-delivery/confirmed-manifest'"

      - name: Remove remote snapshot if interrupted
        if: always()
        env:
          HOST: ${{ secrets.HORUS_PRODUCTION_HOST }}
          USER: ${{ secrets.HORUS_PRODUCTION_SSH_USER }}
        run: |
          remote_dir="$REMOTE_HOME/incoming/static-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -p "$SSH_PORT" "$USER@$HOST" "rm -rf '$remote_dir'" || true
