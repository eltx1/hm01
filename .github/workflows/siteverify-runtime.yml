name: Siteverify native runtime
on:
  pull_request:
    paths:
      - workers/siteverify/**
      - tests/Workers/**
      - tests/Browser/siteverify-worker.test.js
      - .github/workflows/siteverify-runtime.yml
      - .github/workflows/deploy-siteverify.yml
  push:
    branches: [main]
    paths:
      - workers/siteverify/**
      - tests/Workers/**
      - tests/Browser/siteverify-worker.test.js
      - .github/workflows/siteverify-runtime.yml
      - .github/workflows/deploy-siteverify.yml
permissions:
  contents: read
jobs:
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/Browser/siteverify-worker.test.js
      - run: npm ci --prefix tests/Workers --no-audit --no-fund
      - run: npm test --prefix tests/Workers
