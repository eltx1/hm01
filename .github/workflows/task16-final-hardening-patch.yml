name: Task 16 Final Hardening Patch

on:
  push:
    branches:
      - task-16-prebid-admin-control-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-16-prebid-admin-control-hardening
          fetch-depth: 0
      - name: Apply final hardening changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          view = Path('resources/views/admin/prebid/index.blade.php')
          text = view.read_text()
          text = text.replace('Selected GAM network. Public bidder IDs only; never secrets.', 'Selected Prebid profile. Public bidder IDs only; never secrets.')
          view.write_text(text)

          test = Path('tests/Feature/PrebidModeControlHardeningTest.php')
          text = test.read_text()
          marker = '    private function site(ServingMode $mode, PrebidConfiguredMode $configuredMode, bool $prebid): Site\n'
          method = '''    public function test_explicit_standalone_owns_mapped_placement_even_when_gam_is_available(): void
    {
        $site = $this->site(ServingMode::HorusGam, PrebidConfiguredMode::Standalone, true);
        $placement = $this->placement($site, 'standalone_on_gam_site');
        $this->mapPrebid($site, $placement, standalone: true);

        $config = $this->config($site, 1606);

        $this->assertTrue($config['engines']['gam']['enabled']);
        $this->assertTrue($config['engines']['prebid']['enabled']);
        $this->assertSame('STANDALONE', data_get($config, 'engines.prebid.deliveryMode'));
        $this->assertSame('PREBID_STANDALONE', data_get($config, 'placements.0.renderer'));
        $this->assertFalse(data_get($config, 'placements.0.gamEnabled'));
        $this->assertNull(data_get($config, 'placements.0.adUnitPath'));
    }

'''
          if marker not in text:
              raise SystemExit('test helper marker missing')
          test.write_text(text.replace(marker, method + marker, 1))

          doc = Path('docs/PREBID_STANDALONE_RUNTIME.md')
          text = doc.read_text()
          appendix = '''

## Admin delivery-mode control (Task 16)

The website control plane stores a configured Prebid preference separately from the resolved runtime mode:

- `AUTO`: prefer a real eligible GAM bridge; otherwise resolve to an enabled standalone site profile. On `HORUS_DIRECT`, standalone is the topology target and remains action-required until its profile is complete.
- `GAM_BRIDGE`: explicit bridge intent. If GAM is unavailable or operationally disabled, Prebid stops with `ACTION REQUIRED`; Horus never silently switches this explicit selection to standalone.
- `STANDALONE`: explicit direct-render intent. A mapped standalone placement owns its physical render surface even if the site also has an eligible GAM connection; unrelated GAM placements may continue through GAM.

`AUTO` is never emitted as the runtime delivery mode. Static schema v3 may expose the configured value for diagnostics, but `prebid.deliveryMode` and the Loader always receive only `GAM_BRIDGE` or `STANDALONE`.

The existing Admin Prebid screen manages both modes. Shared build, bidder/account mappings, timeout, currency, sequence, consent, lazy loading and refresh controls are reused. GAM setup preview/runs are displayed only for resolved `GAM_BRIDGE`. Standalone uses its site-owned runtime profile and does not create GAM setup objects.

Operational precedence is unchanged: `AD_SERVING OFF` stops all engines; `PREBID OFF` stops either Prebid delivery mode; `GAM OFF` stops an explicit bridge but does not stop an independently configured standalone profile. Publisher readiness exposes only safe Header Bidding status/explanation; detailed configured/resolved mode, mapping/build and relevant GAM/static-delivery diagnostics remain Admin-only.
'''
          if '## Admin delivery-mode control (Task 16)' not in text:
              doc.write_text(text.rstrip() + appendix + '\n')
          PY
          php -l tests/Feature/PrebidModeControlHardeningTest.php
          rm .github/workflows/task16-final-hardening-patch.yml
      - name: Commit materialized changes
        run: |
          set -euo pipefail
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 16: finalize Prebid admin and runtime hardening"
          git push origin HEAD:task-16-prebid-admin-control-hardening
