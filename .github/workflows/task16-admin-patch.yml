name: Task 16 Admin Patch

on:
  push:
    branches: [task-16-prebid-admin-control-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-16-prebid-admin-control-hardening
          fetch-depth: 0
      - name: Patch Prebid admin controller and view
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/Http/Controllers/Admin/PrebidController.php')
          s = p.read_text()
          s = s.replace("use App\\Http\\Controllers\\Controller;\n", "use App\\Enums\\PrebidConfiguredMode;\nuse App\\Enums\\PrebidDeliveryMode;\nuse App\\Http\\Controllers\\Controller;\n")
          s = s.replace("use App\\Models\\PrebidSetupRun;\n", "use App\\Models\\PrebidSetupRun;\nuse App\\Models\\PrebidSetting;\n")
          s = s.replace("use App\\Services\\Prebid\\PrebidManager;\n", "use App\\Services\\Prebid\\PrebidManager;\nuse App\\Services\\Serving\\SiteEngineStateResolver;\n")
          old = '''        PrebidGamSetupService $setup,\n    ): View {\n        $connection = $connections->requireFor($site);\n        $settings = $manager->settingsFor($connection);\n'''
          new = '''        PrebidGamSetupService $setup,\n        SiteEngineStateResolver $engines,\n    ): View {\n        $engineState = $engines->resolve($site);\n        $connection = $engineState->gamConnection;\n        $settings = $engineState->prebidDeliveryMode === PrebidDeliveryMode::Standalone\n            ? $manager->settingsForSite($site)\n            : ($connection ? $manager->settingsFor($connection) : new PrebidSetting([\n                'enabled' => false,\n                'prebid_build_id' => PrebidBuild::query()->where('is_active', true)->latest('built_at')->value('id'),\n                'auction_timeout_ms' => config('prebid.default_timeout_ms', 1200),\n                'price_granularity' => 'medium',\n                'currency' => config('prebid.default_currency', 'USD'),\n                'bidder_sequence' => 'fixed',\n                'consent_behavior' => [],\n                'lazy_loading' => ['enabled' => true],\n                'refresh_behavior' => ['enabled' => true, 'minimumIntervalSeconds' => 30],\n                'bidder_timeout_reporting' => true,\n                'gam_fallback' => true,\n            ]));\n'''
          if old not in s: raise SystemExit('index block not found')
          s = s.replace(old, new, 1)
          s = s.replace("            'connection' => $connection,\n", "            'connection' => $connection,\n            'engineState' => $engineState,\n")
          s = s.replace("            'setupPreview' => $setup->preview($connection),\n            'setupRuns' => PrebidSetupRun::withoutGlobalScopes()->where('gam_connection_id', $connection->id)->latest()->limit(10)->get(),\n", "            'setupPreview' => $connection && $engineState->prebidDeliveryMode === PrebidDeliveryMode::GamBridge ? $setup->preview($connection) : null,\n            'setupRuns' => $connection && $engineState->prebidDeliveryMode === PrebidDeliveryMode::GamBridge\n                ? PrebidSetupRun::withoutGlobalScopes()->where('gam_connection_id', $connection->id)->latest()->limit(10)->get()\n                : collect(),\n")
          s = s.replace("        SiteConfigPublisher $publisher,\n    ): RedirectResponse {\n", "        SiteConfigPublisher $publisher,\n        SiteEngineStateResolver $engines,\n    ): RedirectResponse {\n", 1)
          s = s.replace("            'enabled' => ['sometimes', 'boolean'],\n", "            'enabled' => ['sometimes', 'boolean'],\n            'prebid_configured_mode' => ['required', Rule::enum(PrebidConfiguredMode::class)],\n", 1)
          old2 = '''        $site->update(['prebid_enabled' => $data['enabled']]);\n        $manager->updateSettings($connections->requireFor($site), $data, $request->user());\n        $version = $publisher->publishActiveProduction($site->refresh(), $request->user());\n\n        return back()->with('status', $version\n            ? 'Prebid settings saved and production configuration v'.$version->version.' was queued automatically.'\n            : 'Prebid settings saved and will publish automatically when the website is activated.');\n'''
          new2 = '''        $configuredMode = PrebidConfiguredMode::from($data['prebid_configured_mode']);\n        unset($data['prebid_configured_mode']);\n        $site->update(['prebid_enabled' => $data['enabled']]);\n        $site->servingSettings()->updateOrCreate(\n            ['site_id' => $site->id],\n            [\n                'organization_id' => $site->organization_id,\n                'serving_mode' => $site->serving_mode,\n                'prebid_enabled' => $data['enabled'],\n                'prebid_configured_mode' => $configuredMode,\n            ],\n        );\n\n        $site = $site->refresh()->load('servingSettings');\n        $engineState = $engines->resolve($site);\n        if ($configuredMode === PrebidConfiguredMode::Auto\n            && $engineState->prebidDeliveryMode === PrebidDeliveryMode::GamBridge\n            && $engineState->prebidReason === 'GAM_BRIDGE_CONNECTION_REQUIRED') {\n            // AUTO with unavailable/disabled GAM uses the submitted values to\n            // establish the standalone profile, then resolves again.\n            $manager->updateStandaloneSettings($site, $data, $request->user());\n            $engineState = $engines->resolve($site->refresh()->load('servingSettings'));\n        } elseif ($engineState->prebidDeliveryMode === PrebidDeliveryMode::Standalone) {\n            $manager->updateStandaloneSettings($site, $data, $request->user());\n            $engineState = $engines->resolve($site->refresh()->load('servingSettings'));\n        } elseif ($engineState->gamConnection !== null) {\n            $manager->updateSettings($engineState->gamConnection, $data, $request->user());\n        }\n\n        $version = $publisher->publishActiveProduction($site->refresh(), $request->user());\n        $message = 'Prebid settings saved. Configured '.$configuredMode->value.'; resolved '.$engineState->prebidDeliveryMode->value.'. ';\n        if ($configuredMode === PrebidConfiguredMode::GamBridge && $engineState->prebidReason === 'GAM_BRIDGE_CONNECTION_REQUIRED') {\n            $message .= 'ACTION REQUIRED: GAM bridge is unavailable; no standalone fallback was applied. ';\n        }\n        $message .= $version\n            ? 'Production configuration v'.$version->version.' was queued automatically.'\n            : 'The production configuration will publish automatically when the website is activated.';\n\n        return back()->with('status', $message);\n'''
          if old2 not in s: raise SystemExit('update block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          v = Path('resources/views/admin/prebid/index.blade.php')
          s = v.read_text()
          s = s.replace("        <p>{{ $connection->type->value }} · network {{ $connection->network_code }} · publishers never create Prebid line items manually.</p>\n", "        <p>Configured {{ $engineState->prebidConfiguredMode->value }} · resolved {{ $engineState->prebidDeliveryMode->value }} · {{ $engineState->prebidReason }}.</p>\n        @if($engineState->prebidConfiguredMode->value === 'GAM_BRIDGE' && $engineState->prebidReason === 'GAM_BRIDGE_CONNECTION_REQUIRED')<p class=\"error\"><strong>ACTION REQUIRED:</strong> explicit GAM_BRIDGE is unavailable. Horus will not silently switch this website to standalone.</p>@endif\n")
          s = s.replace("        <p class=\"eyebrow\">Selected GAM network</p>\n", "        <p class=\"eyebrow\">Website Prebid control</p>\n")
          marker = "        <label>Prebid build\n"
          mode = '''        <label>Delivery mode\n            <select class="hm-input" name="prebid_configured_mode" required>\n                @foreach(['AUTO','GAM_BRIDGE','STANDALONE'] as $mode)<option value="{{ $mode }}" @selected($engineState->prebidConfiguredMode->value === $mode)>{{ $mode }}</option>@endforeach\n            </select>\n        </label>\n        <p class="muted">AUTO prefers an eligible GAM bridge; if GAM is unavailable or operationally disabled and standalone is configured, it resolves to STANDALONE. Explicit GAM_BRIDGE never silently falls back.</p>\n'''
          if marker not in s: raise SystemExit('view settings marker not found')
          s = s.replace(marker, mode + marker, 1)
          s = s.replace('> Enable Prebid for this selected network and website</label>', '> Enable Prebid for this website</label>')
          s = s.replace('> Always fall back to GAM</label>', '> GAM fallback behavior (bridge mode only)</label>')
          gam_start = '''<section class="detail-grid">\n<article>\n    <p class="eyebrow">Centralized GAM automation</p>'''
          if gam_start not in s: raise SystemExit('GAM section start not found')
          s = s.replace(gam_start, '''@if($connection && $engineState->prebidDeliveryMode->value === 'GAM_BRIDGE')\n<section class="detail-grid">\n<article>\n    <p class="eyebrow">Centralized GAM automation</p>''', 1)
          s = s.replace("</section>\n@endsection", "</section>\n@else\n<article><p class=\"eyebrow\">Standalone delivery</p><h3>No GAM automation required</h3><p class=\"muted\">This resolved mode uses the pinned Horus Prebid build and direct isolated banner rendering. GAM setup objects are not created or modified.</p></article>\n@endif\n@endsection", 1)
          v.write_text(s)
          PY
          php -l app/Http/Controllers/Admin/PrebidController.php
          rm .github/workflows/task16-admin-patch.yml
      - name: Commit
        run: |
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 16: make Prebid admin delivery-mode aware"
          git push origin HEAD:task-16-prebid-admin-control-hardening
