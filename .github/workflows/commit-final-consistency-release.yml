name: Commit final consistency release

on:
  push:
    branches:
      - agent/final-production-consistency

permissions:
  contents: write

jobs:
  build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/final-production-consistency
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, soap, openssl, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build verified production assets and package
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm audit --audit-level=moderate
          npm run test:browser
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          ./scripts/build-release.sh
          ./scripts/validate-release.sh
      - name: Commit final package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/horus-media-platform.zip release/CHECKSUMS.txt public/assets/hm-loader.min.js public/assets/prebid
          git add -f public/build
          git diff --cached --quiet || git commit -m 'Rebuild verified production release after consistency fixes'
          git push origin HEAD:agent/final-production-consistency
