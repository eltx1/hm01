name: Validate early verification dependencies
on:
  push:
    branches: [diagnostic/early-cf-20260930]
    paths: [.github/workflows/early-cf-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3bc3a7f04590f9818ba8c9b1d4ac18fba1455f08
          path: code
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d4c9644038b193dc24f00ba46590f69114edb7ff
          path: staging
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify candidate bytes
        shell: python
        run: |
          import pathlib,base64,gzip,hashlib,os
          pairs=[('early-cf','d12324dbbc8dfc3758736fbd150f71b0e31392008666454d901f6745e50893b6'),('early-cf-refine','5babc07c60b8df9d997b6c1428f8368a87c387a241fea66b69ab0f69c3c2e91e'),('early-cf-origin','7835cd3e7a6e1f1d9f1536eb71b02450cae18c69ce0e1ea84b2175357861bc26'),('early-cf-ready-only','dbf32faea97b1eb3ba1bd57491b4b39ff3e6c4884fedb23a4d784535aa64b280')]
          for name,digest in pairs:
              encoded=pathlib.Path('staging/diagnostics/'+name+'.patch.gz.base64').read_text().strip()
              if name=='early-cf-refine': encoded=encoded.replace('cf+eYAhUZ','cf+YAhUZ',1)
              patch=gzip.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(patch).hexdigest()==digest
              pathlib.Path(os.environ['RUNNER_TEMP'],name+'.patch').write_bytes(patch)
      - name: Prepare browser dependencies and preserve actual baseline build
        working-directory: code
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
          npx playwright install --with-deps chromium webkit
          npm run build:loader
          cp public/assets/hm-loader.min.js "$RUNNER_TEMP/early-baseline.js"
          cp public/traffic-gate/index.html "$RUNNER_TEMP/early-baseline-gate.html"
      - name: Apply reviewed changes and build candidate
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          for name in early-cf early-cf-refine early-cf-origin early-cf-ready-only; do
            git apply --check "$RUNNER_TEMP/$name.patch"
            git apply "$RUNNER_TEMP/$name.patch"
          done
          git add -N tests/Browser/early-verification.playwright.spec.js
          git diff --check
          git diff HEAD -- playwright.traffic-gate.config.js public/assets/traffic-gate/horus-traffic-gate.js public/traffic-gate/index.html scripts/loader-startup-trace.mjs scripts/transform-loader-traffic-gate.mjs tests/Browser/early-verification.playwright.spec.js tests/Browser/hm-loader-traffic-gate.test.js tests/Browser/traffic-gate.test.js > "$RUNNER_TEMP/early-cf-final.patch"
          echo "9c076d26d96a8ec7f4047c7aadb1125e3817b653a3425efb4f09cf38d3fa180b  $RUNNER_TEMP/early-cf-final.patch" | sha256sum -c -
          npm run build:loader
          sha256sum public/assets/hm-loader.min.js public/assets/traffic-gate/horus-traffic-gate.js public/traffic-gate/index.html > "$RUNNER_TEMP/early-compiled-sha256.txt"
      - name: Run complete Node regressions
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/Browser/*.test.js | tee "$RUNNER_TEMP/early-node.log"
      - name: Run early verification browser matrix and controlled comparison
        working-directory: code
        shell: bash
        env:
          HM_EARLY_BASELINE: ${{ runner.temp }}/early-baseline.js
          HM_EARLY_BASELINE_HTML: ${{ runner.temp }}/early-baseline-gate.html
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.traffic-gate.config.js tests/Browser/early-verification.playwright.spec.js --max-failures=4 | tee "$RUNNER_TEMP/early-browser.log"
      - name: Run existing full browser suite without weakening assertions
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.traffic-gate.config.js | tee "$RUNNER_TEMP/early-full-browser.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: early-cf-validation
          path: |
            ${{ runner.temp }}/early-cf-final.patch
            ${{ runner.temp }}/early-compiled-sha256.txt
            ${{ runner.temp }}/early-node.log
            ${{ runner.temp }}/early-browser.log
            ${{ runner.temp }}/early-full-browser.log
            code/test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: error
