name: Inspect reported publisher HTML only
on:
  push:
    branches: [diagnostic/video-black-flash-20260929]
    paths: [.github/workflows/natega-public-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public script metadata without JavaScript execution
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,json,pathlib,re
          from html.parser import HTMLParser
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__();self.scripts=[];self.links=[];self.slots=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and (a.get('src') or a.get('data-site-key')):
                      self.scripts.append({k:v for k,v in a.items() if k in ['src','type','async','defer','crossorigin','data-site-key','data-config-version','data-cfasync']})
                  if tag=='link' and a.get('rel') in ['preload','preconnect','modulepreload','icon']:
                      self.links.append({k:v for k,v in a.items() if k in ['href','rel','as','crossorigin']})
                  if 'data-placement' in a: self.slots.append({k:v for k,v in a.items() if k in ['id','class','style','data-placement']})
          url='https://natega.bluekl.com/'
          report={'url':url,'mode':'public-html-only-no-ad-execution'}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; HorusMedia-ReadOnly-Diagnostics/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(2000000).decode('utf8',errors='replace');report.update(status=r.status,content_type=r.headers.get('Content-Type'),final_url=r.url)
              p=Tags();p.feed(data)
              report.update(scripts=p.scripts,links=p.links,slots=p.slots)
          except urllib.error.HTTPError as e:
              report.update(status=e.code,cf_mitigated=e.headers.get('cf-mitigated'),content_type=e.headers.get('Content-Type'))
          except Exception as e: report['error']=type(e).__name__
          pathlib.Path('natega-public.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: natega-public-metadata
          path: natega-public.json
          retention-days: 7
          if-no-files-found: error
