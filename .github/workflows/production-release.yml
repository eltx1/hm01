name: Production release validation

on:
  pull_request:
  push:
    branches:
      - main
      - agent/production-ready-final

permissions:
  contents: write

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, soap, openssl, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and audit dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm audit --audit-level=moderate
      - name: Static, browser, and PHP validation
        run: |
          find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/static-analysis.php
          npm run test:browser
          npm run build
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --seed --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan route:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan schedule:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan test
      - name: Install production PHP dependencies and build ZIP
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          ./scripts/build-release.sh
          ./scripts/validate-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: horus-media-platform-${{ github.sha }}
          path: |
            release/horus-media-platform.zip
            release/CHECKSUMS.txt
            release/*.md
          retention-days: 30
      - name: Commit final release files to release branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-ready-final' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/horus-media-platform.zip release/CHECKSUMS.txt public/assets/hm-loader.min.js public/assets/prebid
          git add -f public/build
          git diff --cached --quiet || git commit -m 'Build verified Horus Media production release'
          git push origin HEAD:agent/production-ready-final
