name: Production release validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Authenticate Composer to GitHub only for this workflow run. The token is
  # ephemeral and never written into the release or repository.
  COMPOSER_AUTH: >-
    {"github-oauth":{"github.com":"${{ github.token }}"}}
  COMPOSER_MAX_PARALLEL_HTTP: 2

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, openssl, fileinfo, soap
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install and audit dependencies
        run: |
          bash scripts/install-composer-ci.sh
          npm ci
          npm audit --audit-level=moderate
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Validate deployment foundation
        run: |
          bash -n ops/deploy/horus-atomic-deploy.sh
          bash -n ops/deploy/horus-bootstrap-atomic-layout.sh
          php -l ops/deploy/write-mysql-client-config.php
          bash tests/Deployment/bootstrap-layout-test.sh
          bash tests/Deployment/atomic-deploy-test.sh
      - name: Static, browser, and PHP validation
        run: |
          find app bootstrap config database routes tests scripts ops -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/static-analysis.php
          npm run test:browser
          npx playwright test --config=playwright.traffic-gate.config.js
          npm run build
          test -s public/assets/hm-loader.js
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.js
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/horus-prebid.sha256
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --seed --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:rollback --step=1 --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan route:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan schedule:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan test
      - name: Smoke-test production environment template
        run: |
          rm -f .env database/production-smoke.sqlite
          cp .env.production.example .env
          php artisan key:generate --force
          touch database/production-smoke.sqlite
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan migrate:fresh --seed --force
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan schedule:list
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan route:list >/dev/null
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan config:cache
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan config:clear
          rm -f database/production-smoke.sqlite
      - name: Install production PHP dependencies and validate ZIP
        run: |
          rm -rf vendor
          bash scripts/install-composer-ci.sh --no-dev
          ./scripts/build-release.sh
          ./scripts/validate-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: horus-media-platform-${{ github.sha }}
          path: |
            release/horus-media-platform.zip
            release/CHECKSUMS.txt
            release/*.md
          retention-days: 30
