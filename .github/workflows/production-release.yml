name: Production release validation

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/diagnose-shared-server-20261023.yml'

permissions:
  contents: read
  # Read-only: find a successful PR validation of the identical code tree.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Authenticate Composer to GitHub only for this workflow run. The token is
  # ephemeral and never written into the release or repository.
  COMPOSER_AUTH: >-
    {"github-oauth":{"github.com":"${{ github.token }}"}}
  COMPOSER_MAX_PARALLEL_HTTP: 2

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reuse validation of the identical pull request tree
        id: reuse
        # Only for main pushes. The deploy gate still requires this run to succeed
        # and still builds, validates and checksums the release artifact below.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HORUS_FULL_MAIN_VALIDATION != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const full = `${owner}/${repo}`;
            const { data: current } = await github.rest.repos.getCommit({ owner, repo, ref: context.sha });
            const tree = current.commit.tree.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'production-release.yml', event: 'pull_request', status: 'success', per_page: 50,
            });
            for (const run of data.workflow_runs) {
              // Same repository only (never a fork), latest successful attempt of this workflow.
              if (run.conclusion !== 'success' || run.head_repository?.full_name !== full || run.path !== '.github/workflows/production-release.yml') continue;
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: run.head_sha });
              // An identical tree means identical code and identical workflow definition.
              if (commit.commit.tree.sha === tree) {
                core.notice(`Identical tree ${tree} already passed full validation in run ${run.id}; skipping duplicate test steps.`);
                core.setOutput('validated', 'true');
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.notice('No successful pull request validation of this exact tree; running full validation.');
            core.setOutput('validated', 'false');
      - name: Verify deployment release checks
        run: bash tests/Deployment/verify-active-release-test.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, openssl, fileinfo, soap
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install and audit dependencies
        run: |
          bash scripts/install-composer-ci.sh
          npm ci
          node --test tests/Deployment/npm-audit-ci.test.mjs
          node scripts/audit-npm-ci.mjs
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
          bash scripts/install-playwright-ci.sh
      - name: Render changed forms through real application routes
        if: steps.reuse.outputs.validated != 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          HORUS_UI_FIXTURES=1 php artisan test --filter='FormExperienceTest|ReportPerformanceMetricsTest|AdExchangeUnmatchedRequestsTest|NullableReportingMetricsViewTest|VideoReportExperienceTest|GamRevenueComparisonTest|GamRevenueCorrectionTest|ImpersonationAuditTest|SiteVideoInventoryTest|DashboardLayoutTest'
      - name: Build and inspect report and publisher-login previews
        if: steps.reuse.outputs.validated != 'true'
        run: |
          npm run build
          npx playwright test --config=playwright.form-experience.config.js video-reporting-experience.playwright.spec.js publisher-impersonation.playwright.spec.js site-video-inventory.playwright.spec.js dashboard-layout.playwright.spec.js
      - name: Preserve Video report visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-report-experience-${{ github.sha }}
          path: |
            test-results/form-experience/**/video-report-*.png
            test-results/form-experience/**/site-video-inventory-*.png
            test-results/form-experience/**/error-context.md
            storage/framework/testing/video-reporting/*.html
            storage/framework/testing/site-video-inventory/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Validate deployment foundation
        run: |
          bash -n ops/deploy/horus-atomic-deploy.sh
          bash -n ops/deploy/horus-bootstrap-atomic-layout.sh
          bash -n scripts/verify-static-edge-public.sh
          bash -n scripts/verify-traffic-gate-public.sh
          bash -n scripts/verify-cloudflare-pages-domain-active.sh
          php -l ops/deploy/write-mysql-client-config.php
          bash tests/Deployment/mysql-client-config-test.sh
          bash tests/Deployment/bootstrap-layout-test.sh
          bash tests/Deployment/atomic-deploy-test.sh
      - name: Build production assets (identical tree already validated)
        if: steps.reuse.outputs.validated == 'true'
        run: |
          npm run build
          test -s public/assets/hm-loader.js
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.js
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/horus-prebid.sha256
      - name: Static, browser, and PHP validation
        if: steps.reuse.outputs.validated != 'true'
        run: |
          find app bootstrap config database routes tests scripts ops -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/static-analysis.php
          npm run test:browser
          npx playwright test --config=playwright.traffic-gate.config.js
          npm run build
          test -s public/assets/hm-loader.js
          test -s public/assets/hm-loader.min.js
          test -s public/assets/prebid/horus-prebid.js
          test -s public/assets/prebid/horus-prebid.min.js
          test -s public/assets/prebid/horus-prebid.sha256
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --seed --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:rollback --step=1 --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate --force
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan route:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan schedule:list
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan test
      - name: Review real Blade forms in desktop and mobile browsers
        if: steps.reuse.outputs.validated != 'true'
        run: |
          npx playwright test --config=playwright.form-experience.config.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: form-experience-${{ github.sha }}
          path: test-results/form-experience
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-metrics-${{ github.sha }}
          path: |
            test-results/form-experience/**/reports-*.png
            storage/framework/testing/form-experience/reports-*.html
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-navigation-${{ github.sha }}
          path: |
            test-results/form-experience/**/navigation-*.png
            test-results/form-experience/**/workspace-*.png
            storage/framework/testing/form-experience/workspace-*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Smoke-test production environment template
        run: |
          rm -f .env database/production-smoke.sqlite
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-*.php bootstrap/cache/events.php
          cp .env.production.example .env
          php artisan key:generate --force
          touch database/production-smoke.sqlite
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan migrate:fresh --seed --force
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan schedule:list
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan route:cache
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan route:list >/dev/null
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan route:clear
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan config:cache
          APP_ENV=production DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/production-smoke.sqlite" php artisan config:clear
          rm -f database/production-smoke.sqlite
      - name: Install production PHP dependencies and validate ZIP
        run: |
          rm -rf vendor
          bash scripts/install-composer-ci.sh --no-dev
          ./scripts/build-release.sh
          ./scripts/validate-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: horus-media-platform-${{ github.sha }}
          path: |
            release/horus-media-platform.zip
            release/CHECKSUMS.txt
            release/*.md
          retention-days: 30

