name: Task18 Targeted Tests

'on':
  push:
    branches:
      - task-18-direct-demand-admin-control-center

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-18-direct-demand-admin-control-center
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, soap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and apply validated harness/UI corrections
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-interaction --no-progress
          python3 - <<'PY'
          from pathlib import Path

          p = Path('resources/views/admin/demand/index.blade.php')
          text = p.read_text()
          text = text.replace("route('admin.supply-chain.ads-txt.index')", "route('admin.compliance.ads-txt.index')")
          old = '''                <label>Approved script origins<textarea class="hm-input" rows="3" name="script_origins[]">{{ implode("\n", $network->script_origins ?? []) }}</textarea></label>'''
          new = '''                <div><label>Approved script origins</label>@foreach($network->script_origins ?? [] as $origin)<input class="hm-input" type="url" name="script_origins[]" value="{{ $origin }}">@endforeach<input class="hm-input" type="url" name="script_origins[]" placeholder="https://provider.example"></div>'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/Feature/DirectDemandAdminControlCenterTest.php')
          text = p.read_text()
          if 'use App\\Models\\DemandAdsTxtRecord;' not in text:
              text = text.replace('use App\\Models\\DemandAccount;\n', 'use App\\Models\\DemandAccount;\nuse App\\Models\\DemandAdsTxtRecord;\n')
          text = text.replace('$this->actingAs($this->admin)', '$this->adminSession()')
          text = text.replace("        $this->assertDatabaseHas('ads_txt_records', ['site_id' => $this->site->id, 'account_id' => '100']);", "        $this->assertTrue(DemandAdsTxtRecord::withoutGlobalScopes()\n            ->where('site_id', $this->site->id)\n            ->where('demand_account_id', $this->account->id)\n            ->where('publisher_account_id', '100')\n            ->where('status', 'ACTIVE')\n            ->exists());")
          marker = '    private function approvedMgid($site, $placement): array\n'
          helper = '''    private function adminSession(): static\n    {\n        $this->actingAs($this->admin);\n        $this->withSession(['two_factor_passed_at' => now()->timestamp]);\n\n        return $this;\n    }\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('adminSession insertion marker missing')
              text = text.replace(marker, helper + marker, 1)
          p.write_text(text)
          PY
          php -l app/Services/Monetization/SiteMonetizationReadinessService.php
          php -l app/Http/Controllers/Admin/DemandNetworkController.php
          php -l tests/Feature/DirectDemandAdminControlCenterTest.php
      - name: Targeted backend matrix
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/DirectDemandAdminControlCenterTest.php
          php artisan test tests/Feature/UniversalDirectDemandEngineTest.php
          php artisan test tests/Feature/DemandNetworkSystemTest.php
          php artisan test tests/Feature/GamOptionalServingModelTest.php
      - name: Browser regressions
        run: |
          set -euo pipefail
          npm ci
          node --test tests/Browser/hm-loader-direct-demand.test.js tests/Browser/hm-loader-prebid-standalone.test.js tests/Browser/hm-loader-prebid-mode-hardening.test.js tests/Browser/hm-loader-native.test.js
      - name: Commit validated corrections and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/task18-targeted-tests.yml
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 18: validate Direct Demand Admin operations"
          git push origin HEAD:task-18-direct-demand-admin-control-center
