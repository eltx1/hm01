name: Task18 Targeted Tests

'on':
  push:
    branches:
      - task-18-direct-demand-admin-control-center

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-18-direct-demand-admin-control-center
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, soap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and patch
        run: composer install --prefer-dist --no-interaction --no-progress && python3 scripts/task18_targeted_fix.py
      - name: Lint
        run: php -l app/Services/Monetization/SiteMonetizationReadinessService.php && php -l app/Http/Controllers/Admin/DemandNetworkController.php && php -l tests/Feature/DirectDemandAdminControlCenterTest.php
      - name: Backend matrix
        run: cp .env.example .env && php artisan key:generate && php artisan test tests/Feature/DirectDemandAdminControlCenterTest.php && php artisan test tests/Feature/UniversalDirectDemandEngineTest.php && php artisan test tests/Feature/DemandNetworkSystemTest.php && php artisan test tests/Feature/GamOptionalServingModelTest.php
      - name: Browser regressions
        run: npm ci && node --test tests/Browser/hm-loader-direct-demand.test.js tests/Browser/hm-loader-prebid-standalone.test.js tests/Browser/hm-loader-prebid-mode-hardening.test.js tests/Browser/hm-loader-native.test.js
      - name: Commit validated result
        run: |
          git config user.name "Horus Media CI"
          git config user.email "ci@horusmedia.net"
          git add -A
          git commit -m "Task 18: validate Direct Demand Admin operations"
          git push origin HEAD:task-18-direct-demand-admin-control-center
